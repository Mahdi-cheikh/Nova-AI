<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Times New Roman', Times, serif">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.6; }
      .box-l1 { fill: #1f2937; stroke: #1f2937; }
      .box-l2 { fill: #f3f4f6; stroke: #1f2937; stroke-width: 1.4; }
      .box-l3 { fill: #ffffff; stroke: #6b7280; stroke-width: 1.2; }
      .t  { font-size: 14px; fill: #111827; text-anchor: middle; }
      .t-light { font-size: 14px; fill: #ffffff; text-anchor: middle; font-weight: 600; }
      .t-bold { font-weight: 700; }
      .t-small { font-size: 11px; fill: #4b5563; text-anchor: middle; }
      .line { stroke: #1f2937; stroke-width: 1.4; fill: none; }
      .title { font-size: 17px; fill: #111827; text-anchor: middle; font-weight: 700; }
    </style>
  </defs>

  <!-- Title -->
  <text x="550" y="32" class="title">Organigramme de l'organisme d'accueil</text>

  <!-- Niveau 1 — Direction Générale -->
  <rect x="430" y="60" width="240" height="60" rx="6" class="box-l1" />
  <text x="550" y="86" class="t-light t-bold">Direction Générale</text>
  <text x="550" y="106" class="t-light" font-size="12">Gérant / Directeur Général</text>

  <!-- Lignes de descente vers Niveau 2 -->
  <line x1="550" y1="120" x2="550" y2="160" class="line" />
  <line x1="170" y1="160" x2="930" y2="160" class="line" />
  <line x1="170" y1="160" x2="170" y2="190" class="line" />
  <line x1="425" y1="160" x2="425" y2="190" class="line" />
  <line x1="675" y1="160" x2="675" y2="190" class="line" />
  <line x1="930" y1="160" x2="930" y2="190" class="line" />

  <!-- Niveau 2 — 4 départements -->
  <rect x="60"  y="190" width="220" height="62" rx="6" class="box-l2" />
  <text x="170" y="218" class="t t-bold">Département Technique</text>
  <text x="170" y="237" class="t-small">Développement &amp; R&amp;D</text>

  <rect x="315" y="190" width="220" height="62" rx="6" class="box-l2" />
  <text x="425" y="218" class="t t-bold">Département Commercial</text>
  <text x="425" y="237" class="t-small">Ventes &amp; Relation Client</text>

  <rect x="565" y="190" width="220" height="62" rx="6" class="box-l2" />
  <text x="675" y="218" class="t t-bold">Département Administratif</text>
  <text x="675" y="237" class="t-small">Finance &amp; Comptabilité</text>

  <rect x="820" y="190" width="220" height="62" rx="6" class="box-l2" />
  <text x="930" y="218" class="t t-bold">Département RH</text>
  <text x="930" y="237" class="t-small">Recrutement &amp; Formation</text>

  <!-- Lignes de descente vers Niveau 3 — Technique -->
  <line x1="170" y1="252" x2="170" y2="295" class="line" />
  <line x1="80"  y1="295" x2="260" y2="295" class="line" />
  <line x1="80"  y1="295" x2="80"  y2="320" class="line" />
  <line x1="170" y1="295" x2="170" y2="320" class="line" />
  <line x1="260" y1="295" x2="260" y2="320" class="line" />

  <!-- Niveau 3 — sous-unités Technique -->
  <rect x="20"  y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="80"  y="346" class="t">Pôle</text>
  <text x="80"  y="362" class="t t-bold">Développement</text>

  <rect x="110" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="170" y="346" class="t">Pôle</text>
  <text x="170" y="362" class="t t-bold">IA &amp; Data</text>

  <rect x="200" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="260" y="346" class="t">Pôle</text>
  <text x="260" y="362" class="t t-bold">DevOps / QA</text>

  <!-- Lignes Commercial -->
  <line x1="425" y1="252" x2="425" y2="295" class="line" />
  <line x1="365" y1="295" x2="485" y2="295" class="line" />
  <line x1="365" y1="295" x2="365" y2="320" class="line" />
  <line x1="485" y1="295" x2="485" y2="320" class="line" />

  <rect x="305" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="365" y="346" class="t">Service</text>
  <text x="365" y="362" class="t t-bold">Ventes</text>

  <rect x="425" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="485" y="346" class="t">Service</text>
  <text x="485" y="362" class="t t-bold">Marketing</text>

  <!-- Lignes Administratif -->
  <line x1="675" y1="252" x2="675" y2="295" class="line" />
  <line x1="615" y1="295" x2="735" y2="295" class="line" />
  <line x1="615" y1="295" x2="615" y2="320" class="line" />
  <line x1="735" y1="295" x2="735" y2="320" class="line" />

  <rect x="555" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="615" y="346" class="t">Service</text>
  <text x="615" y="362" class="t t-bold">Comptabilité</text>

  <rect x="675" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="735" y="346" class="t">Cellule</text>
  <text x="735" y="362" class="t t-bold">Juridique</text>

  <!-- Lignes RH -->
  <line x1="930" y1="252" x2="930" y2="295" class="line" />
  <line x1="870" y1="295" x2="990" y2="295" class="line" />
  <line x1="870" y1="295" x2="870" y2="320" class="line" />
  <line x1="990" y1="295" x2="990" y2="320" class="line" />

  <rect x="810" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="870" y="346" class="t">Cellule</text>
  <text x="870" y="362" class="t t-bold">Recrutement</text>

  <rect x="930" y="320" width="120" height="58" rx="5" class="box-l3" />
  <text x="990" y="346" class="t">Cellule</text>
  <text x="990" y="362" class="t t-bold">Formation</text>

  <!-- Stagiaire — position relative au pôle d'accueil (IA & Data) -->
  <line x1="170" y1="378" x2="170" y2="415" class="line" stroke-dasharray="4 3" />
  <rect x="80"  y="415" width="180" height="60" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
  <text x="170" y="441" class="t t-bold" fill="#7c2d12">Stagiaire PFE</text>
  <text x="170" y="460" class="t-small" fill="#7c2d12">Mehdi Cheikh — Licence ISIMK</text>

  <!-- Légende -->
  <g transform="translate(60, 600)">
    <rect x="0" y="0" width="20" height="14" fill="#1f2937" />
    <text x="28" y="11" class="t-small" text-anchor="start">Direction</text>
    <rect x="120" y="0" width="20" height="14" fill="#f3f4f6" stroke="#1f2937" stroke-width="1.2" />
    <text x="148" y="11" class="t-small" text-anchor="start">Département</text>
    <rect x="260" y="0" width="20" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1.2" />
    <text x="288" y="11" class="t-small" text-anchor="start">Service / Pôle / Cellule</text>
    <rect x="450" y="0" width="20" height="14" fill="#fef3c7" stroke="#b45309" stroke-width="1.6" />
    <text x="478" y="11" class="t-small" text-anchor="start">Stagiaire (rattaché par lien fonctionnel)</text>
  </g>

  <text x="550" y="675" class="t-small">Source : structure interne de l'organisme d'accueil — entretien avec la direction RH</text>
</svg>
