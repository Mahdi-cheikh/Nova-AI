<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0a0e27" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<title>Nova AI — 24/7 Virtual Receptionist</title>
<link rel="manifest" href="/pwa/manifest.json" />
<link rel="apple-touch-icon" href="/pwa/icons/icon-192.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%2310b981'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='system-ui' font-size='34' font-weight='800' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E" />
<style>
  /* ================= THEME (dark default + light override) ================= */
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --bg:#0a0e27; --bg-2:#0f1535; --card:#131a3f; --card-2:#1a2350;
    --border:#252e5e; --text:#e2e8f0; --text-dim:#94a3b8; --text-faint:#64748b;
    --primary:#6366f1; --primary-2:#818cf8; --accent:#10b981; --warn:#f59e0b; --danger:#ef4444;
    --whatsapp:#25d366; --whatsapp-bg:#0b141a;
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --hero-grad-1:rgba(99,102,241,.18); --hero-grad-2:rgba(16,185,129,.12);
  }
  [data-theme="light"]{
    --bg:#f8fafc; --bg-2:#ffffff; --card:#ffffff; --card-2:#f1f5f9;
    --border:#e2e8f0; --text:#0f172a; --text-dim:#475569; --text-faint:#94a3b8;
    --primary:#6366f1; --primary-2:#4f46e5; --accent:#059669; --warn:#d97706; --danger:#dc2626;
    --whatsapp:#25d366; --whatsapp-bg:#efeae2;
    --shadow:0 8px 24px rgba(15,23,42,.08);
    --hero-grad-1:rgba(99,102,241,.10); --hero-grad-2:rgba(16,185,129,.08);
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .2s,color .2s}
  body{background:radial-gradient(1200px 600px at 20% -10%,var(--hero-grad-1),transparent 60%),radial-gradient(900px 500px at 100% 0%,var(--hero-grad-2),transparent 50%),var(--bg)}
  a{color:var(--primary-2);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit}
  .hidden{display:none !important}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;transition:all .2s;border:1px solid transparent}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#4f46e5);color:#fff;box-shadow:0 8px 20px -8px rgba(99,102,241,.6)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -8px rgba(99,102,241,.8)}
  .btn-ghost{background:var(--card-2);color:var(--text);border-color:var(--border)}
  .btn-ghost:hover{background:var(--border)}
  .btn-accent{background:linear-gradient(135deg,var(--accent),#059669);color:#fff}
  .btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  [data-theme="light"] .btn-danger{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
  .btn-google{background:#fff;color:#1f2937;border:1px solid #e5e7eb}
  .btn-google:hover{background:#f9fafb}
  .btn-block{width:100%;justify-content:center}

  .nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--border)}
  .nav-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
  .logo-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff;font-weight:900}
  .nav-links{display:flex;gap:8px;align-items:center}

  .hero{max-width:1200px;margin:0 auto;padding:80px 24px 60px;text-align:center}
  .hero h1{font-size:clamp(34px,5.4vw,60px);line-height:1.05;margin:0 0 18px;font-weight:800;letter-spacing:-.02em}
  .hero h1 span{background:linear-gradient(135deg,var(--primary-2),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:19px;color:var(--text-dim);max-width:680px;margin:0 auto 34px;line-height:1.55}
  .hero-cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

  .features{max-width:1200px;margin:30px auto 60px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
  .feature{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;transition:transform .2s,border-color .2s}
  .feature:hover{transform:translateY(-3px);border-color:var(--primary)}
  .feature-icon{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,rgba(99,102,241,.2),rgba(16,185,129,.15));display:grid;place-items:center;font-size:22px;margin-bottom:14px}
  .feature h3{margin:0 0 8px;font-size:16px}
  .feature p{margin:0;color:var(--text-dim);font-size:14px;line-height:1.55}

  .who{max-width:1100px;margin:0 auto 60px;padding:0 24px}
  .who h2{text-align:center;font-size:30px;margin-bottom:24px}
  .who-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .who-card{background:var(--card);border:1px solid var(--border);padding:18px;border-radius:12px;text-align:center}
  .who-card .ic{font-size:28px;margin-bottom:8px;color:var(--primary-2)}
  .who-card h4{margin:0 0 4px;font-size:15px}
  .who-card p{margin:0;font-size:12.5px;color:var(--text-dim)}

  .auth-wrap,.wizard-wrap,.setup-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px}
  .auth-card,.wizard,.setup-card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:34px;box-shadow:var(--shadow)}
  .wizard{max-width:540px}
  .setup-card{max-width:560px}
  .auth-tabs{display:flex;gap:6px;background:var(--bg-2);padding:4px;border-radius:10px;margin-bottom:22px;border:1px solid var(--border)}
  .auth-tab{flex:1;padding:9px;text-align:center;border-radius:8px;font-weight:600;font-size:14px;color:var(--text-dim);transition:all .2s}
  .auth-tab.active{background:var(--primary);color:#fff}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:500}
  .field input,.field select,.field textarea{width:100%;padding:11px 13px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:14.5px;transition:border-color .15s}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary)}
  .auth-card form .btn,.wizard .btn-block{width:100%;justify-content:center;margin-top:8px}
  .auth-divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-faint);font-size:12px}
  .auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .auth-foot{text-align:center;margin-top:14px;color:var(--text-dim);font-size:13px}

  .wizard-progress{display:flex;align-items:center;gap:8px;margin-bottom:26px}
  .wp-step{flex:1;height:6px;border-radius:999px;background:var(--bg-2);border:1px solid var(--border)}
  .wp-step.done{background:var(--accent);border-color:var(--accent)}
  .wp-step.active{background:linear-gradient(90deg,var(--primary),var(--bg-2))}
  .wizard h2{margin:0 0 8px;font-size:22px}
  .wizard p.lede{margin:0 0 22px;color:var(--text-dim);font-size:14px;line-height:1.55}
  .verify-row{display:flex;gap:8px;margin:16px 0}
  .verify-row input{flex:1;text-align:center;font-size:18px;letter-spacing:.4em;font-family:'JetBrains Mono',monospace}
  .integration-card{display:flex;gap:14px;padding:14px;background:var(--bg-2);border:1px solid var(--border);border-radius:12px;align-items:center;margin-bottom:14px}
  .integration-card .logo-sq{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;font-weight:700;color:#1f2937;flex-shrink:0;font-size:20px}
  .integration-card .body{flex:1;min-width:0}
  .integration-card .t{font-weight:600;font-size:14px;margin-bottom:2px}
  .integration-card .d{font-size:12.5px;color:var(--text-dim);line-height:1.4}
  .integration-card .status{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:4px}

  .plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .plan{background:var(--bg-2);border:2px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:all .15s;text-align:center}
  .plan:hover{border-color:var(--primary)}
  .plan.selected{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--bg-2))}
  .plan .name{font-weight:700;font-size:14px}
  .plan .price{font-size:22px;font-weight:800;margin:6px 0;color:var(--primary-2)}
  .plan .price small{font-size:11px;color:var(--text-faint);font-weight:500}
  .plan .desc{font-size:11.5px;color:var(--text-dim)}

  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .sidebar{background:var(--bg-2);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar .logo{padding:0 6px 18px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .biz-pill{padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:14px}
  .biz-pill .name{font-weight:700;font-size:14px;margin-bottom:2px}
  .biz-pill .type{font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
  .biz-pill .plan{font-size:10.5px;color:var(--accent);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;color:var(--text-dim);font-size:14px;font-weight:500;margin-bottom:3px;transition:all .15s;cursor:pointer;width:100%;text-align:left}
  .nav-item:hover{background:var(--card-2);color:var(--text)}
  .nav-item.active{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary-2)}
  .nav-item .ic{width:18px;text-align:center;font-size:15px}
  .nav-item .b{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border)}

  .main{padding:22px 28px;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:18px;flex-wrap:wrap}
  .topbar h1{margin:0;font-size:24px;font-weight:700}
  .topbar .sub{color:var(--text-dim);font-size:14px;margin-top:4px}
  .topbar-actions{display:flex;align-items:center;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer;font-size:17px;color:var(--text)}
  .icon-btn:hover{background:var(--card-2)}
  .bell{position:relative}
  .bell .dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:var(--danger);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

  .user-pill{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--card);border:1px solid var(--border);border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
  .user-pill img,.user-pill .initials{width:30px;height:30px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .user-pill .name{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-pill:hover{background:var(--card-2)}

  .cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;text-align:center;font-weight:600}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-cell{background:var(--bg-2);border:1px solid var(--border);border-radius:8px;min-height:96px;padding:6px;font-size:11.5px;display:flex;flex-direction:column;gap:3px}
  .cal-cell.empty{background:transparent;border:none;visibility:hidden}
  .cal-cell.today{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--card))}
  .cal-day{font-weight:700;color:var(--text-dim);font-size:12px}
  .cal-cell.today .cal-day{color:var(--primary-2)}
  .cal-evs{display:flex;flex-direction:column;gap:2px;overflow:hidden}
  .cal-cell.has-events{cursor:pointer}
  .cal-cell.has-events:hover{background:color-mix(in srgb,var(--primary) 6%,var(--bg-2))}
  .cal-ev{background:var(--accent);color:#fff;padding:2px 5px;border-radius:4px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
  .cal-more{cursor:pointer;font-weight:500}
  .cal-more:hover{color:var(--primary-2);text-decoration:underline}
  .day-list-row:hover{background:var(--card)!important;border-color:var(--primary)!important}
  .cal-ev.cancelled{background:var(--text-faint);text-decoration:line-through}
  .cal-more{font-size:10px;color:var(--text-faint)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
  .stat .lbl{color:var(--text-dim);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .stat .val{font-size:28px;font-weight:700}
  .stat .delta{font-size:12px;margin-top:4px;color:var(--accent)}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:18px}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .panel-head h3{margin:0;font-size:15px}
  .panel-head .meta{font-size:12.5px;color:var(--text-dim)}
  .panel-body{padding:14px 18px}
  .panel-body.no-pad{padding:0}

  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 18px;text-align:left;border-bottom:1px solid var(--border);font-size:13.5px}
  th{font-weight:600;color:var(--text-dim);background:var(--card-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--card-2)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.green{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .pill.amber{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .pill.red{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
  .pill.blue{background:color-mix(in srgb,var(--primary) 15%,transparent);color:var(--primary-2)}
  .pill.gray{background:var(--card-2);color:var(--text-dim)}

  .toasts{position:fixed;top:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:360px;width:calc(100vw - 32px)}
  .toast{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 14px;display:flex;gap:12px;box-shadow:var(--shadow);animation:slideIn .3s cubic-bezier(.4,0,.2,1)}
  .toast.urgent{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 10%,var(--card))}
  .toast.success{border-color:var(--accent)}
  .toast .ic{width:34px;height:34px;border-radius:9px;background:var(--card-2);display:grid;place-items:center;font-size:16px;flex-shrink:0}
  .toast.urgent .ic{background:var(--danger);color:#fff}
  .toast.success .ic{background:var(--accent);color:#fff}
  .toast .body{flex:1;min-width:0}
  .toast .body .t{font-weight:600;font-size:13.5px;margin-bottom:2px}
  .toast .body .d{font-size:12.5px;color:var(--text-dim);line-height:1.4}
  .toast .x{align-self:flex-start;color:var(--text-faint);font-size:18px;line-height:1;padding:2px 4px}
  @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

  .notif-list{max-height:520px;overflow-y:auto}
  .notif{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);transition:background .15s;cursor:pointer}
  .notif:hover{background:var(--card-2)}
  .notif:last-child{border-bottom:none}
  .notif.unread{background:color-mix(in srgb,var(--primary) 6%,var(--card))}
  .notif .ic{width:36px;height:36px;border-radius:10px;background:var(--card-2);display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .notif.urgent .ic{background:var(--danger);color:#fff}
  .notif .body{flex:1;min-width:0}
  .notif .body .t{font-size:13.5px;font-weight:500;margin-bottom:3px}
  .notif .body .m{font-size:12.5px;color:var(--text-dim);line-height:1.4}
  .notif .body .ts{font-size:11px;color:var(--text-faint);margin-top:4px}

  .modal-bg{position:fixed;inset:0;background:rgba(5,8,22,.7);backdrop-filter:blur(6px);z-index:300;display:grid;place-items:center;padding:20px;animation:fadeIn .15s}
  [data-theme="light"] .modal-bg{background:rgba(15,23,42,.45)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
  .modal h3{margin:0 0 18px;font-size:18px}

  .empty{padding:50px 20px;text-align:center;color:var(--text-dim)}
  .empty .ic{font-size:36px;margin-bottom:10px;opacity:.5}

  .activity-feed{max-height:560px;overflow-y:auto}
  .act-item{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
  .act-item:last-child{border-bottom:none}
  .act-item .ic{font-size:14px;color:var(--text-faint);font-family:monospace;min-width:60px}
  .act-item .body{font-size:13px}
  .act-item .body .t{color:var(--text-dim);font-size:11.5px;margin-bottom:2px}

  .loading{display:inline-block;width:14px;height:14px;border:2px solid var(--text-faint);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .full-loader{display:grid;place-items:center;min-height:100vh;color:var(--text-dim);gap:12px;flex-direction:column}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg-2)}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint)}
  .footer{border-top:1px solid var(--border);padding:24px;text-align:center;color:var(--text-dim);font-size:13px;margin-top:40px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .text-right{text-align:right}
  .mt-2{margin-top:14px}
  .code{font-family:'JetBrains Mono',Consolas,monospace;background:var(--bg-2);padding:2px 6px;border-radius:4px;font-size:12px;border:1px solid var(--border)}

  @media (max-width:1024px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.plans{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="toasts" class="toasts"></div>
<div id="app"><div class="full-loader"><div class="loading"></div><div>Loading Nova AI…</div></div></div>
<div id="modal-root"></div>

<script type="module">
/* ================================================================
   NOVA AI — Production frontend
   - Real Supabase auth + CRUD + realtime
   - Light/dark theme (system preference + override)
   - First-run setup screen for Supabase config
   - Wired to Edge Functions for AI classification
   ================================================================ */

import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4';

function applyTheme(){
  const stored = localStorage.getItem(THEME_KEY);            /* 'light' | 'dark' | 'system' | null */
  const sysDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = stored && stored !== 'system' ? stored : (sysDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  return theme;
}

/* Resilient render: wraps render() in a timeout so the dashboard never sits
   on a blank page forever. If it hangs past 8 seconds, surface a recovery card. */
let DASHBOARD_RENDERING = false;
async function safeRender(){
  if (DASHBOARD_RENDERING) return;
  DASHBOARD_RENDERING = true;
  try {
    await Promise.race([
      render(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('Dashboard load timed out')), 8000)),
    ]);
  } catch (err) {
    console.error('Dashboard render failed:', err);
    const app = document.getElementById('app');
    if (app) app.innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <div style="background:#13151c;border:1px solid rgba(99,102,241,0.2);border-radius:18px;padding:30px;max-width:380px;text-align:center;color:#f3f4f6">
        <div style="width:54px;height:54px;border-radius:13px;background:linear-gradient(135deg,#6366f1,#22d3ee);display:grid;place-items:center;color:white;font-weight:800;font-size:24px;margin:0 auto 14px">N</div>
        <h2 style="margin:0 0 8px;font-size:18px">Could not load dashboard</h2>
        <p style="margin:0 0 16px;font-size:13.5px;color:#9ca3af">${(err && err.message) || 'Network or session issue.'}</p>
        <button onclick="location.reload()" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border:0;padding:12px 22px;border-radius:10px;font-weight:600;cursor:pointer;width:100%;margin-bottom:8px">Reload</button>

      </div></div>`;
  } finally {
    DASHBOARD_RENDERING = false;
  }
}

/* ---------- 4. NOTIFICATIONS (toast) ---------- */
function toast({title, message, type='info', urgent=false}){
  const root=$('#toasts'); if(!root) return;
  const cls = urgent?'urgent':(type==='booking'?'success':(type==='cancel'?'urgent':''));
  const ic = urgent?'!':(type==='booking'?'OK':(type==='cancel'?'×':'i'));
  const el=document.createElement('div');
  el.className='toast '+cls;
  el.innerHTML=`<div class="ic">${ic}</div><div class="body"><div class="t">${escapeHtml(title)}</div><div class="d">${escapeHtml(message||'')}</div></div><button class="x">×</button>`;
  el.querySelector('.x').onclick=()=>el.remove();
  root.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transform='translateX(20px)';setTimeout(()=>el.remove(),300);}, urgent?8000:5000);
}

/* ---------- 5. SUPABASE CLIENT BOOT ---------- */
async function bootSupabase(){
  if (!CFG?.supabaseUrl || !CFG?.supabaseAnonKey){return false;}
  try {
    sb = createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    /* Validate by getting auth session */
    await sb.auth.getSession();
    setupAuthListener();
    return true;
  } catch (e){
    console.error('Supabase init failed', e);
    toast({title:'Connection failed', message:e.message, urgent:true});
    return false;
  }
}

async function loadSession(){
  if (!sb) return null;
  // Cap each step with its own timeout so a hanging Supabase call can't freeze
  // the entire dashboard. If anything stalls beyond 4s, we proceed with what we have.
  let session = null;
  try {
    const r = await Promise.race([
      sb.auth.getSession(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('session-timeout')), 4000)),
    ]);
    session = r?.data?.session || null;
  } catch (e) { console.warn('getSession timed out:', e); return null; }
  if (!session) return null;
  let member = null;
  try {
    const r = await Promise.race([
      sb.from('users').select('*, businesses(*)').eq('auth_uid', session.user.id).maybeSingle(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('member-timeout')), 4000)),
    ]);
    member = r?.data || null;
  } catch (e) { console.warn('member lookup timed out:', e); }
  return member ? {user: session.user, business: member.businesses, member} : {user: session.user, business: null, member: null};
}

/* Hard reset for the dashboard — same pattern as the PWA. Clears any stuck
   Supabase auth artefact and reloads. Used by error-recovery UI. */
function dashboardHardReset(){
  try { for (const k of Object.keys(localStorage)) { if (k.startsWith('sb-') || k.includes('supabase')) localStorage.removeItem(k); } } catch (_e) {}
  try { sessionStorage.clear(); } catch (_e) {}
  try { if (sb) sb.auth.signOut().catch(() => {}); } catch (_e) {}
  location.replace(location.pathname + '?reset=' + Date.now());
}

/* Global auth-state listener: catches the moment Supabase finishes processing
   an OAuth callback. provider_refresh_token is only present in this brief
   window, so we persist it to the business row immediately. */
function setupAuthListener(){
  if (window.__novaAuthListener) return;
  window.__novaAuthListener = true;
  sb.auth.onAuthStateChange(async (event, session)=>{
    if (event === 'SIGNED_IN' && session && !SESSION){
      SESSION = await loadSession();
      render();
    }
  });
}

/* ============================================================
   NOTIFICATION SYSTEM — sound, popup, native push, page-title pulse
   ============================================================ */
const NOVA_NOTIF = {
  audioCtx: null,
  soundOn: localStorage.getItem('nova_sound') !== '0',
  pushPermission: ('Notification' in window) ? Notification.permission : 'unsupported',
  titlePulseTimer: null,
  originalTitle: document.title,
};

/* Web Audio API tone generator — no audio files needed.
   Each notification type gets a distinctive tonal signature. */
function novaPlaySound(kind = 'info') {
  if (!NOVA_NOTIF.soundOn) return;
  try {
    if (!NOVA_NOTIF.audioCtx) NOVA_NOTIF.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = NOVA_NOTIF.audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;

    const playTone = (freq, start, dur, gain = 0.18, type = 'sine') => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now + start);
      g.gain.setValueAtTime(0, now + start);
      g.gain.linearRampToValueAtTime(gain, now + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + dur + 0.05);
    };

    if (kind === 'urgent') {
      // Three sharp alarm beeps, alternating high/low — clearly distinctive
      playTone(880, 0,    0.18, 0.28, 'square');
      playTone(660, 0.22, 0.18, 0.28, 'square');
      playTone(880, 0.44, 0.18, 0.28, 'square');
      playTone(660, 0.66, 0.22, 0.32, 'square');
    } else if (kind === 'booking' || kind === 'info') {
      // Pleasant two-note chime (C5 → E5) — happy confirmation
      playTone(523.25, 0,    0.18, 0.20);
      playTone(659.25, 0.18, 0.32, 0.18);
    } else if (kind === 'cancel' || kind === 'reschedule') {
      // Single soft mid-low note
      playTone(392, 0, 0.32, 0.20);
    } else {
      playTone(523.25, 0, 0.22, 0.18);
    }
  } catch (e) { console.warn('Sound failed:', e); }
}

/* Native browser notifications (when tab not focused) */
async function novaRequestPushPermission() {
  if (!('Notification' in window)) return false;
  if (Notification.permission === 'granted') return true;
  if (Notification.permission === 'denied') return false;
  const r = await Notification.requestPermission();
  NOVA_NOTIF.pushPermission = r;
  return r === 'granted';
}

function novaPushNotify({title, body, urgent}) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible') return; // only when tab not focused
  try {
    const n = new Notification(title || 'Nova AI', {
      body: body || '',
      icon: '/pwa/icons/icon-192.png',
      badge: '/pwa/icons/icon-192.png',
      tag: urgent ? 'nova-urgent' : 'nova',
      requireInteraction: !!urgent,
      vibrate: urgent ? [200, 100, 200] : [120],
    });
    n.onclick = () => { window.focus(); n.close(); };
    if (!urgent) setTimeout(() => n.close(), 6000);
  } catch (_e) {}
}

/* Page-title pulse — flashes "🔔 NEW · Nova AI" until tab is focused */
function novaPulseTitle(label) {
  if (NOVA_NOTIF.titlePulseTimer) return; // already pulsing
  let alt = false;
  NOVA_NOTIF.titlePulseTimer = setInterval(() => {
    document.title = alt ? NOVA_NOTIF.originalTitle : `🔔 ${label || 'New activity'} · Nova AI`;
    alt = !alt;
  }, 1100);
  const stop = () => {
    if (NOVA_NOTIF.titlePulseTimer) { clearInterval(NOVA_NOTIF.titlePulseTimer); NOVA_NOTIF.titlePulseTimer = null; }
    document.title = NOVA_NOTIF.originalTitle;
    document.removeEventListener('visibilitychange', onVis);
    window.removeEventListener('focus', stop);
  };
  const onVis = () => { if (document.visibilityState === 'visible') stop(); };
  document.addEventListener('visibilitychange', onVis);
  window.addEventListener('focus', stop);
}

/* Rich popup overlay — distinct from the small toast. Shown for important
   real-time events. Stacks vertically, urgent ones require dismissal. */

    stack = document.createElement('div');

    : { bg: 'linear-gradient(135deg,#6366f1,#8b5cf6)', icon: '🔔', accent: '#c7d2fe' };

  card.style.cssText = `pointer-events:auto;background:${palette.bg};color:white;border-radius:14px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,0.35);display:flex;gap:12px;align-items:flex-start;transform:translateX(120%);transition:transform .35s cubic-bezier(0.34,1.56,0.64,1), opacity .25s;${urgent ? 'border:2px solid rgba(255,255,255,0.4);animation:nova-pulse 1.2s ease-in-out infinite' : ''}`;
  card.innerHTML = `
    <div style="font-size:22px;line-height:1;flex-shrink:0;width:36px;height:36px;background:rgba(255,255,255,0.22);border-radius:10px;display:grid;place-items:center">${palette.icon}</div>
    <div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:14px;line-height:1.3">${escapeHtml(title || '')}</div>
      <div style="font-size:12.5px;opacity:.95;line-height:1.5;margin-top:3px;word-break:break-word">${escapeHtml(message || '')}</div>
      ${action ? `<div style="margin-top:8px"><button class="nova-popup-action" style="background:rgba(255,255,255,0.22);color:white;border:0;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12px;cursor:pointer">${escapeHtml(action.label)}</button></div>` : ''}
    </div>
    <button class="nova-popup-close" style="background:transparent;color:white;opacity:.75;border:0;font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0">×</button>`;
  stack.appendChild(card);
  requestAnimationFrame(() => { card.style.transform = 'translateX(0)'; });

  const close = () => {
    card.style.transform = 'translateX(120%)';
    card.style.opacity = '0';
    setTimeout(() => card.remove(), 350);
  };
  card.querySelector('.nova-popup-close').onclick = close;
  if (action) card.querySelector('.nova-popup-action').onclick = () => { close(); try { action.onClick(); } catch (_e) {} };
  if (!urgent) setTimeout(close, 6500);
}

/* Master notification dispatcher: sound + popup + native push + bell shake + title pulse */
function novaNotify(payload) {
  const { title, message, type, urgent } = payload || {};
  novaPlaySound(urgent ? 'urgent' : type);
  novaPopup({ title, message, type, urgent });
  novaPushNotify({ title, body: message, urgent });
  if (urgent) novaPulseTitle('URGENT');
  else if (document.visibilityState !== 'visible') novaPulseTitle('New');
  // Visual bell shake
  const bell = document.getElementById('bell-btn');
  if (bell) { bell.classList.remove('nova-bell-shake'); void bell.offsetWidth; bell.classList.add('nova-bell-shake'); }
}

/* Realtime: subscribe to notifications + appointments for current business */
function subscribeRealtime(){
  if (realtimeChannel){ realtimeChannel.unsubscribe(); realtimeChannel=null; }
  if (!SESSION?.business) return;
  const bizId = SESSION.business.id;
  realtimeChannel = sb.channel('biz-'+bizId)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'notifications', filter:'business_id=eq.'+bizId},
        payload => {
          // Fire the full notification stack: sound + popup + native push + bell shake + title pulse
          novaNotify({ title: payload.new.title, message: payload.new.message, type: payload.new.type, urgent: payload.new.urgent });
          updateBellBadge();
          /* re-render if we're on a relevant page */
          const r = currentRoute();
          if (r.includes('notifications') || r==='/dashboard' || r==='/dashboard/') render();
        })
    .on('postgres_changes', {event:'*', schema:'public', table:'appointments', filter:'business_id=eq.'+bizId},
        ()=>{ const r=currentRoute(); if (r.includes('appointments')||r==='/dashboard'||r==='/dashboard/') render(); })
    .subscribe();
}

let unreadBadge = 0;
async function updateBellBadge(){
  if (!SESSION?.business) return;
  const {count} = await sb.from('notifications').select('*',{count:'exact',head:true}).eq('business_id',SESSION.business.id).eq('read',false);
  unreadBadge = count||0;
  const b = $('#bell-dot');
  if (!b) return;
  if (unreadBadge===0) b.style.display='none';
  else { b.style.display='grid'; b.textContent = unreadBadge>99?'99+':unreadBadge; }
}

/* ---------- 6. ROUTER ---------- */
async function render(){
  /* No config yet → setup screen */
  if (!CFG){ $('#app').innerHTML = renderSetup(); return bindSetup(); }
  if (!sb){ const ok = await bootSupabase(); if (!ok){ $('#app').innerHTML = renderSetup('Could not connect — check your URL/key'); return bindSetup(); } }

  /* OAuth callback handling */
  if (window.location.hash.includes('access_token')){ /* supabase handles internally via detectSessionInUrl */ }

  const route = currentRoute();
  const isPublic = route==='/' || route===''|| route.startsWith('/auth');

  if (!SESSION) SESSION = await loadSession();

  /* If signed in as a non-owner doctor, force the doctor-specific view */
  if (SESSION?.member?.role === 'doctor' && SESSION.member.id) {
    sessionStorage.setItem('view_doctor_id', SESSION.member.id);
    if (!route.startsWith('/doctor') && !route.startsWith('/auth') && route !== '/') {
      navigate('#/doctor'); return;
    }
  }

  /* If a signed-in user lands on the public landing or /auth pages, send them onward. */
  if (SESSION && (route==='/' || route===''|| route.startsWith('/auth'))){
    if (SESSION.business){
      navigate(SESSION.business.onboarding_complete ? '#/dashboard' : '#/onboard');
    } else {
      navigate('#/create-business');
    }
    return;
  }

  if (route==='/' || route===''){ $('#app').innerHTML = renderLanding(); return bindLanding(); }
  if (route.startsWith('/auth')){ $('#app').innerHTML = renderAuth(); return bindAuth(); }

  /* Below routes need auth */
  if (!SESSION){ navigate('#/auth'); return; }

  /* No business yet → create-business flow */
  if (!SESSION.business){
    if (!route.startsWith('/create-business')){ navigate('#/create-business'); return; }
    $('#app').innerHTML = renderCreateBusiness(); return bindCreateBusiness();
  }

  /* Onboarding wizard removed - all setup is captured in the create-business form */

  /* Doctor view */
  if (route.startsWith('/doctor')){ $('#app').innerHTML = await renderDoctorView(); return bindDoctorView(); }
  if (route.startsWith('/profile')){ $('#app').innerHTML = await renderProfile(); return bindProfile(); }

  /* Dashboard */
  $('#app').innerHTML = await renderDashboard(route);
  await bindDashboard(route);
  subscribeRealtime();
  updateBellBadge();
}

    const url = fd.url.trim().replace(/\/$/,'');
    const key = fd.key.trim();
    if (!url.startsWith('https://') || !url.includes('.supabase.co')){alert('That does not look like a Supabase URL');return;}
    /* Test it */
    try{
      const test = createClient(url, key);
      const r = await test.from('businesses').select('id', {count:'exact', head:true});
      if (r.error && r.error.code!=='42P01'){throw r.error;}
      CFG = {supabaseUrl: url, supabaseAnonKey: key};
      localStorage.setItem(CFG_KEY, JSON.stringify(CFG));
      location.reload();
    }catch(err){
      alert('Connection failed: '+err.message+'\n\nHave you run schema.sql in your Supabase project?');
    }
  };
}

function bindLanding(){
  /* Smooth scroll for in-page anchor nav */
  document.querySelectorAll('.lp a[href^="#"]:not([href="#/auth"]):not([href^="#/auth"])').forEach(a => {
    a.addEventListener('click', (ev) => {
      const id = a.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (target) { ev.preventDefault(); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
  });

  /* Reveal cards on scroll */
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('visible'); io.unobserve(en.target); } });
    }, { threshold: 0.12 });
    document.querySelectorAll('.lp-fadein').forEach(el => io.observe(el));
  } else {
    document.querySelectorAll('.lp-fadein').forEach(el => el.classList.add('visible'));
  }

  /* Install button — uses the captured beforeinstallprompt event if available,
     otherwise opens the PWA URL where the in-app install banner takes over. */
  const installBtn = $('#install-pwa-btn');
  if (installBtn) {
    installBtn.onclick = async () => {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        alert('To install Nova on iPhone:\n\n1. Tap the Share button (square with arrow up)\n2. Scroll and tap "Add to Home Screen"\n3. Tap Add\n\nNova will appear on your home screen like any app.');
        location.href = '/pwa/?install=1';
        return;
      }
      if (window.__deferredInstallPrompt) {
        window.__deferredInstallPrompt.prompt();
        const choice = await window.__deferredInstallPrompt.userChoice;
        window.__deferredInstallPrompt = null;
        if (choice.outcome === 'accepted') toast({title:'Installing Nova', message:'Find it on your home screen', type:'info'});
      } else {
        // First-time visitor — open the PWA so it can install itself there
        location.href = '/pwa/?install=1';
      }
    };
  }
}

/* Capture beforeinstallprompt globally so the landing button can fire it */

function bindAuth(){
  $('#google-btn').onclick = async ()=>{
    const {error} = await sb.auth.signInWithOAuth({
      provider:'google',
      options:{
        redirectTo: window.location.origin+window.location.pathname,
        queryParams:{prompt:'select_account'}
      }
    });
    if (error) toast({title:'Google sign-in failed', message:error.message, urgent:true});
  };
  /* Live email validation hint */
  const emailInput = $('#auth-email');
  const hint       = $('#auth-email-hint');
  if (emailInput && hint) emailInput.oninput = () => {
    const v = emailInput.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    if (!v) { hint.style.display = 'none'; return; }
    hint.style.display = 'block';
    if (valid) {
      hint.textContent = "✓ Looks good — we'll send the magic link there.";
      hint.style.color = '#22c55e';
    } else {
      hint.textContent = "That doesn't look like a valid email yet.";
      hint.style.color = '#eab308';
    }
  };

  $('#auth-form').onsubmit = async (e)=>{
    e.preventDefault();
    const fd       = Object.fromEntries(new FormData(e.target).entries());
    const email    = (fd.email || '').trim().toLowerCase();
    const status   = $('#auth-status');
    const submit   = $('#auth-submit');
    const spinner  = $('#auth-spin');
    const label    = $('#auth-btn-label');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
      status.style.display = 'block';
      status.style.background = 'rgba(239,68,68,0.1)';
      status.style.color = '#ef4444';
      status.textContent = 'Please enter a valid email address.';
      return;
    }

    submit.disabled = true;
    spinner.classList.remove('hidden');
    label.textContent = 'Sending...';
    status.style.display = 'none';

    const {error} = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.origin + window.location.pathname }
    });

    spinner.classList.add('hidden');

    if (error) {
      submit.disabled = false;
      label.textContent = 'Try again';
      status.style.display = 'block';
      status.style.background = 'rgba(239,68,68,0.1)';
      status.style.color = '#ef4444';
      const msg = (error.message||'').toLowerCase().includes('rate')
        ? 'Too many requests in a row — please wait a minute and try again.'
        : 'Could not send the magic link: ' + error.message;
      status.textContent = msg;
      return;
    }

    /* SUCCESS — replace the form area with a confirmation panel */
    label.textContent = '✓ Sent';
    status.style.display = 'block';
    status.style.background = 'rgba(34,197,94,0.10)';
    status.style.color = '#22c55e';
    status.style.textAlign = 'left';
    status.style.padding = '14px 16px';
    status.innerHTML = `
      <div style="font-weight:600;font-size:14.5px;margin-bottom:6px">📩 Check your inbox</div>
      <div style="font-size:13px;line-height:1.55;color:var(--text)">
        We sent a magic link to <b>${escapeHtml(email)}</b>.<br>
        Open the email and click the button to finish signing in. The link is valid for 60 minutes.
      </div>
      <div style="font-size:12px;margin-top:10px;opacity:.8">
        Don't see it? Check your spam folder, or <a href="#" id="auth-resend">send again</a>.
      </div>`;
    setTimeout(() => {
      const r = $('#auth-resend');
      if (r) r.onclick = (ev) => { ev.preventDefault(); submit.disabled = false; label.textContent = 'Send me a magic link'; };
    }, 50);
  };
  sb.auth.onAuthStateChange(async (_event, session)=>{
    if (session && !SESSION){ SESSION = await loadSession(); render(); }
  });
}

function bindCreateBusiness(){
  let chosenPlan='starter';
  let phoneVerified=false;
  let bizIdPending=null;  // we create a row first so the OTP function has a business_id; OR we can call OTP without business and create after.

  setTimeout(()=>{
    $$('#plans .plan').forEach(p=>p.onclick=()=>{chosenPlan=p.dataset.plan;$$('#plans .plan').forEach(x=>x.classList.remove('selected'));p.classList.add('selected');});
  },0);

  const setStatus = (msg, color)=>{
    const el = $('#phone-status');
    if (el){ el.textContent = msg; el.style.color = color || 'var(--text-faint)'; }
  };

  $('#send-code-btn').onclick = async ()=>{
    const phone = $('#cb-phone').value.trim();
    if (!phone || !phone.startsWith('+')) { setStatus('Enter phone in international format starting with +', 'var(--danger)'); return; }
    $('#send-code-btn').disabled = true; $('#send-code-btn').textContent = 'Sending...';
    try {
      // Need a business row to attach OTP to (the verify function references business_id).
      // Create a draft business row if not exists yet.
      if (!bizIdPending){
        const {data:existing} = await sb.from('businesses').select('id').eq('owner_user_id', SESSION.user.id).maybeSingle();
        if (existing){ bizIdPending = existing.id; }
        else {
          const {data:draft, error} = await sb.from('businesses').insert({
            name: ($('input[name=name]').value||'Pending'),
            type: ($('select[name=type]').value||'clinic'),
            phone: phone, email: SESSION.user.email,
            owner_user_id: SESSION.user.id,
            subscription_status: 'trialing', subscription_plan: 'starter',
            whatsapp_verified: false, onboarding_complete: false, ai_receptionist_enabled: true
          }).select().single();
          if (error){ setStatus('Could not save phone: '+error.message, 'var(--danger)'); return; }
          bizIdPending = draft.id;
        }
      } else {
        // Update phone on existing draft
        await sb.from('businesses').update({phone}).eq('id', bizIdPending);
      }
      const {error} = await sb.functions.invoke('send-whatsapp-otp', {body:{phone, business_id: bizIdPending}});
      if (error) throw error;
      $('#otp-row').classList.remove('hidden');
      setStatus('Code sent — check WhatsApp on '+phone, 'var(--accent)');
    } catch (err){
      setStatus('Could not send code: '+err.message, 'var(--danger)');
    } finally {
      $('#send-code-btn').disabled = false; $('#send-code-btn').textContent = 'Resend';
    }
  };

  $('#verify-code-btn').onclick = async ()=>{
    const code = $('#cb-otp').value.trim();
    if (code.length<4) { setStatus('Enter the 6-digit code', 'var(--danger)'); return; }
    $('#verify-code-btn').disabled = true; $('#verify-code-btn').textContent = 'Verifying...';
    const {error} = await sb.functions.invoke('verify-whatsapp-otp', {body:{code, business_id: bizIdPending}});
    $('#verify-code-btn').disabled = false; $('#verify-code-btn').textContent = 'Verify';
    if (error){ setStatus('Wrong code: '+error.message, 'var(--danger)'); return; }
    phoneVerified = true;
    setStatus('Phone verified', 'var(--accent)');
    $('#cb-phone').readOnly = true;
    $('#send-code-btn').classList.add('hidden');
    $('#otp-row').classList.add('hidden');
    $('#cb-submit').disabled = false;
  };

  $('#cb-form').onsubmit = async (e)=>{
    e.preventDefault();
    if (!phoneVerified){ setStatus('Verify your WhatsApp number first', 'var(--danger)'); return; }
    const fd = Object.fromEntries(new FormData(e.target).entries());
    // Update the draft business with final values + flip onboarding_complete
    const {error} = await sb.from('businesses').update({
      name: fd.name, type: fd.type, phone: fd.phone,
      description: fd.description||null,
      subscription_plan: chosenPlan,
      subscription_status: PLANS[chosenPlan].price===0 ? 'active' : 'trialing',
      whatsapp_verified: true, whatsapp_verified_at: new Date().toISOString(),
      onboarding_complete: true
    }).eq('id', bizIdPending);
    if (error){ toast({title:'Could not save', message:error.message, urgent:true}); return; }

    const {data:hasMember} = await sb.from('users').select('id').eq('auth_uid', SESSION.user.id).maybeSingle();
    if (!hasMember){
      const userName = SESSION.user.user_metadata?.full_name || SESSION.user.email.split('@')[0];
      await sb.from('users').insert({
        business_id: bizIdPending, auth_uid: SESSION.user.id,
        name: userName, role:'owner', email: SESSION.user.email, phone: fd.phone
      });
    }
    SESSION = await loadSession();
    toast({title:'Welcome to Nova AI', message:'You are on the '+PLANS[chosenPlan].name+' plan', type:'booking'});
    navigate('#/dashboard');
  };
}

function bindOnboarding(){
  if ($('#send-otp')){
    $('#send-otp').onclick = async ()=>{
      $('#send-otp').textContent='Sending…'; $('#send-otp').disabled=true;
      try{
        const {error} = await sb.functions.invoke('send-whatsapp-otp', {body:{phone: SESSION.business.phone, business_id: SESSION.business.id}});
        if (error) throw error;
        $('#otp-row').classList.remove('hidden');
        toast({title:'Code sent', message:'Check your WhatsApp on '+SESSION.business.phone, type:'info'});
      } catch(err){
        toast({title:'Could not send code', message:err.message+' (Edge Function send-whatsapp-otp not deployed?)', urgent:true});
      } finally { $('#send-otp').textContent='Send code'; $('#send-otp').disabled=false; }
    };
    $('#verify-btn') && ($('#verify-btn').onclick = async ()=>{
      const code = $('#otp').value.trim();
      const {error} = await sb.functions.invoke('verify-whatsapp-otp', {body:{code, business_id: SESSION.business.id}});
      if (error){ toast({title:'Wrong code', message:error.message, urgent:true}); return; }
      SESSION = await loadSession(); render();
    });
  }
  if ($('#g-cal')){
    $('#g-cal').onclick = async ()=>{
      const {error} = await sb.auth.signInWithOAuth({
        provider:'google',
        options:{
          scopes:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/userinfo.email',
          redirectTo: window.location.origin+window.location.pathname,
          queryParams:{access_type:'offline', prompt:'consent'}
        }
      });
      if (error) toast({title:'Google failed', message:error.message, urgent:true});
    };
    $('#skip').onclick = async (e)=>{
      e.preventDefault();
      await sb.from('businesses').update({google_calendar_connected:false}).eq('id', SESSION.business.id);
      SESSION = await loadSession(); render();
    };
    $('#next2').onclick = ()=>render();
  }
  if ($('#plans')){
    let chosen='pro';
    $$('#plans .plan').forEach(p=>p.onclick=()=>{chosen=p.dataset.plan;$$('#plans .plan').forEach(x=>x.classList.remove('selected'));p.classList.add('selected');});
    $('#finish').onclick = async ()=>{
      const {error} = await sb.from('businesses').update({
        subscription_plan: chosen,
        subscription_status: PLANS[chosen].price===0?'active':'trialing',
        onboarding_complete: true,
        trial_ends_at: new Date(Date.now()+14*86400000).toISOString()
      }).eq('id', SESSION.business.id);
      if (error){ toast({title:'Update failed', message:error.message, urgent:true}); return; }
      SESSION = await loadSession();
      toast({title:'Welcome to Nova AI', message:'You are on the '+PLANS[chosen].name+' plan', type:'booking'});
      navigate('#/dashboard');
    };
  }
}


// Adaptive labels based on the business type set during signup.
function bizLabels(type){
  switch (type) {
    case 'clinic':
    case 'laboratoire':
      return { team: 'Doctors', single: 'doctor', viewSelf: true };
    case 'doctor':
      return { team: null, single: 'doctor', viewSelf: false };
    case 'salon':
      return { team: 'Stylists', single: 'stylist', viewSelf: false };
    case 'company':
      return { team: 'Team', single: 'team member', viewSelf: false };
    default:
      return { team: 'Team', single: 'staff', viewSelf: false };
  }
}

    <div style="font-size:11.5px;color:var(--text-faint);margin-bottom:14px">
      Source: <span class="pill ${a.source==='whatsapp_ai'?'blue':a.source==='whatsapp_voice'?'green':'gray'}">${a.source||'manual'}</span>

async function renderCalendar(){
  const params = new URLSearchParams((window.location.hash.split('?')[1])||'');
  const offset = parseInt(params.get('m')||'0',10);
  const today = new Date(); today.setMonth(today.getMonth()+offset);
  const year = today.getFullYear(), month = today.getMonth();
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const startWeek = first.getDay();
  const daysInMonth = last.getDate();
  const monthLabel = today.toLocaleString('en-GB',{month:'long',year:'numeric'});
  const isoStart = `${year}-${String(month+1).padStart(2,'0')}-01`;
  const isoEnd   = `${year}-${String(month+1).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;

  const filterDoc = params.get('doctor') || '';
  const {data:doctorList=[]} = await sb.from('users').select('id,name').eq('business_id', SESSION.business.id).eq('role','doctor').order('name');
  let q = sb.from('appointments')
    .select('*, clients(id,name,phone,age,email), users:doctor_id(name,specialty), services(name,duration_min)')
    .eq('business_id', SESSION.business.id)
    .gte('date', isoStart).lte('date', isoEnd)
    .order('time');
  if (filterDoc) q = q.eq('doctor_id', filterDoc);
  const {data:apts=[]} = await q;

  // stash for click handler
  window.__apts = window.__apts || {};
  for (const a of apts){ window.__apts[a.id] = a; }

  const byDay = {};
  for (const a of apts){
    const d = a.date.slice(8,10);
    (byDay[d] = byDay[d]||[]).push(a);
  }

  let cells = '';
  for (let i=0;i<startWeek;i++) cells += `<div class="cal-cell empty"></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const dStr = String(d).padStart(2,'0');
    const evs = byDay[dStr]||[];
    const isToday = (year===new Date().getFullYear() && month===new Date().getMonth() && d===new Date().getDate());
    const dayKey = `${year}-${String(month+1).padStart(2,'0')}-${dStr}`;
    cells += `<div class="cal-cell ${isToday?'today':''}${evs.length?' has-events':''}" data-day="${dayKey}">
      <div class="cal-day">${d}</div>
      <div class="cal-evs">${evs.slice(0,3).map(a=>`<div class="cal-ev ${a.status==='cancelled'?'cancelled':''}" data-apt="${a.id}" title="${escapeHtml((a.clients?.name||'')+' · '+(a.services?.name||''))}">${a.time.slice(0,5)} ${escapeHtml((a.clients?.name||'—').slice(0,12))}</div>`).join('')}${evs.length>3?`<div class="cal-more" data-day-more="${dayKey}">+${evs.length-3} more</div>`:''}</div>
    </div>`;
  }

  return `<div class="panel">
    <div class="panel-head">
      <h3>${escapeHtml(monthLabel)}</h3>
      <div class="row" style="gap:8px">
        ${doctorList.length > 1 ? `<select id="cal-doctor-filter" style="padding:7px 10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px">
          <option value="">All doctors</option>
          ${doctorList.map(d=>`<option value="${d.id}" ${filterDoc===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
        </select>` : ''}
        <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar?m=${offset-1}${filterDoc?'&doctor='+filterDoc:''}">&larr;</a>
        <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar${filterDoc?'?doctor='+filterDoc:''}">Today</a>
        <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar?m=${offset+1}${filterDoc?'&doctor='+filterDoc:''}">&rarr;</a>
      </div>
    </div>
    <div class="panel-body">
      <div class="cal-head">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  </div>`;
}

async function renderClients(){
  const bizId = SESSION.business.id;
  // Pull every client + aggregate counts/totals so the table can show real stats
  const [{data:cls=[]}, {data:apts=[]}, {data:msgs=[]}] = await Promise.all([
    sb.from('clients').select('*').eq('business_id', bizId).order('created_at',{ascending:false}),
    sb.from('appointments').select('id, client_id, date, status, total_amount').eq('business_id', bizId),
    sb.from('messages').select('id, client_id, created_at').eq('business_id', bizId)
  ]);
  // Index aggregates per client_id
  const stat = {};
  cls.forEach(c => stat[c.id] = {visits:0, last:null, spent:0, msgs:0, upcoming:0});
  const today = new Date().toISOString().slice(0,10);
  (apts||[]).forEach(a => {
    const s = stat[a.client_id]; if (!s) return;
    if (a.status !== 'cancelled') {
      s.visits++;
      if (!s.last || a.date > s.last) s.last = a.date;
      if (a.total_amount) s.spent += Number(a.total_amount);
      if (a.date >= today && a.status !== 'cancelled') s.upcoming++;
    }
  });
  (msgs||[]).forEach(m => { const s = stat[m.client_id]; if (s) s.msgs++; });

  const search = `<input id="cli-search" placeholder="🔍 Search by name, phone or email..." style="width:100%;padding:8px 10px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:inherit;margin:8px 0" />`;

  const rows = cls.map(c => {
    const s = stat[c.id] || {visits:0, last:null, spent:0, msgs:0, upcoming:0};
    const lang = (c.profile && c.profile.language) ? c.profile.language : '—';
    return `<tr class="cli-row" data-id="${c.id}" style="cursor:pointer">
      <td><b>${escapeHtml(c.name||'—')}</b>${c.age?` <span class="sub">(${c.age})</span>`:''}</td>
      <td>${escapeHtml(c.phone||'—')}</td>
      <td>${escapeHtml(c.email||'—')}</td>
      <td><span class="pill blue">${s.visits}</span>${s.upcoming?` <span class="pill green">${s.upcoming} upcoming</span>`:''}</td>
      <td>${s.last||'—'}</td>
      <td>${s.spent>0?`${s.spent.toFixed(0)} TND`:'—'}</td>
      <td>${s.msgs}</td>
      <td><span class="pill gray">${lang}</span></td>
      <td>${new Date(c.created_at).toLocaleDateString()}</td>
    </tr>`;
  }).join('');

  return `<div class="panel"><div class="panel-head"><h3>Patients (${cls.length})</h3><button class="btn btn-primary btn-sm" id="add-cli">+ New client</button></div>
    <div class="panel-body">${search}</div>
    <div class="panel-body no-pad">${cls.length===0?`<div class="empty"><div class="ic">◉</div>No patients yet</div>`:`
    <table class="data"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Visits</th><th>Last visit</th><th>Total spent</th><th>Messages</th><th>Lang</th><th>Joined</th></tr></thead>
    <tbody>${rows}</tbody></table>`}</div></div>`;
}
