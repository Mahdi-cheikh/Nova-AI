       <button class="btn btn-secondary btn-sm" id="add-med">+ Add medication</button>
     </div>
     <div id="med-list">${medsHtml}</div>
   </div>

   <div style="${sectionStyle}">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
       <div style="font-weight:600;font-size:13.5px">Allergies</div>
       <button class="btn btn-secondary btn-sm" id="add-al">+ Add allergy</button>
     </div>
     <div id="al-list">${alHtml}</div>
   </div>

   <div style="${sectionStyle}">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">

       <button class="btn btn-secondary btn-sm" id="add-cd">+ Add condition</button>
     </div>
     <div id="cd-list">${cdHtml}</div>
   </div>

   <div class="row" style="justify-content:flex-end;gap:8px;margin-top:18px">
     <button class="btn btn-secondary btn-sm" onclick="closeModal()">Cancel</button>
     <button class="btn btn-primary btn-sm" id="rx-meds-save">Save changes</button>
   </div>`;
 };

 const reBind = () => {
   const root = document.querySelector('#modal-root .modal');
   if (!root) return;
   root.innerHTML = renderAll();
   // Wire add buttons
   root.querySelector('#add-med').onclick = () => { meds.push({name:'',dose:'',freq:''}); reBind(); };
   root.querySelector('#add-al').onclick  = () => { allergies.push({substance:'',severity:'medium',reaction:''}); reBind(); };
   root.querySelector('#add-cd').onclick  = () => { conds.push({name:'',since:''}); reBind(); };
   // Wire delete buttons
   root.querySelectorAll('[data-del-med]').forEach(b => b.onclick = () => { meds.splice(parseInt(b.dataset.delMed,10),1); reBind(); });
   root.querySelectorAll('[data-del-al]').forEach(b  => b.onclick = () => { allergies.splice(parseInt(b.dataset.delAl,10),1); reBind(); });
   root.querySelectorAll('[data-del-cd]').forEach(b  => b.onclick = () => { conds.splice(parseInt(b.dataset.delCd,10),1); reBind(); });
   // Live-sync inputs back into the working arrays
   root.querySelectorAll('[data-row-med]').forEach(row => {
     const i = parseInt(row.dataset.rowMed, 10);
     row.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { meds[i][inp.dataset.f] = inp.value.trim(); });
   });
   root.querySelectorAll('[data-row-al]').forEach(row => {
     const i = parseInt(row.dataset.rowAl, 10);
     row.querySelectorAll('[data-f]').forEach(inp => {
       const handler = () => { allergies[i][inp.dataset.f] = inp.value.trim(); };
       inp.oninput = handler; inp.onchange = handler;
     });
   });
   root.querySelectorAll('[data-row-cd]').forEach(row => {
     const i = parseInt(row.dataset.rowCd, 10);
     row.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { conds[i][inp.dataset.f] = inp.value.trim(); });
   });
   // Save
   root.querySelector('#rx-meds-save').onclick = async () => {
     // Strip empty rows
     const cleanMeds = meds.filter(m => (m.name||'').trim());
     const cleanAl   = allergies.filter(a => (a.substance||'').trim());
     const cleanCd   = conds.filter(x => (x.name||'').trim());
     const { error } = await sb.from('clients').update({
       medications: cleanMeds, allergies: cleanAl, conditions: cleanCd,
     }).eq('id', clientId);
     if (error) { toast({title:'Save failed', message:error.message, urgent:true}); return; }
     // Refresh in-memory cache so the snapshot reads fresh values
     if (window.__rxClients?.[clientId]) {
       window.__rxClients[clientId].medications = cleanMeds;
       window.__rxClients[clientId].allergies   = cleanAl;
       window.__rxClients[clientId].conditions  = cleanCd;
     }
     toast({title:'Saved', message:`${c.name}'s record updated — ${cleanMeds.length} med${cleanMeds.length===1?'':'s'}, ${cleanAl.length} allerg${cleanAl.length===1?'y':'ies'}.`, type:'info'});
     closeModal(); render();
   };
 };

 openModal(renderAll());
 reBind();
}

       <tbody>${suggestions.map(s => `<tr>

       </tr>`).join('')}</tbody>
     </table>
   </div>
 </div>` : ''}

 <div class="panel">
   <div class="panel-head"><h3>All services (${services.length})</h3></div>
   <div class="panel-body no-pad">
     <table class="responsive-stack">
       <thead><tr><th>Service</th><th>Doctor</th><th>Scheduled</th><th>Drift vs actual</th><th>Auto-adjust</th><th>Last reviewed</th></tr></thead>
       <tbody>${services.map(s => `<tr>

       </tr>`).join('')}</tbody>
     </table>
   </div>
 </div>`;
}

async function renderCalendar(){
 const params = new URLSearchParams((window.location.hash.split('?')[1])||'');
 const offset = parseInt(params.get('m')||'0',10);
 const today = new Date(); today.setMonth(today.getMonth()+offset);
 const year = today.getFullYear(), month = today.getMonth();
 const first = new Date(year, month, 1);
 const last = new Date(year, month+1, 0);
 const startWeek = first.getDay();
 const daysInMonth = last.getDate();
 const monthLabel = today.toLocaleString('en-GB',{month:'long',year:'numeric'});
 const isoStart = `${year}-${String(month+1).padStart(2,'0')}-01`;
 const isoEnd = `${year}-${String(month+1).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;

 const filterDoc = params.get('doctor') || '';
 const {data:doctorList=[]} = await sb.from('users').select('id,name').eq('business_id', SESSION.business.id).eq('role','doctor').order('name');
 let q = sb.from('appointments')
 .select('*, clients(id,name,phone,age,email), users:doctor_id(name,specialty), services(name,duration_min)')
 .eq('business_id', SESSION.business.id)
 .gte('date', isoStart).lte('date', isoEnd)
 .order('time');
 if (filterDoc) q = q.eq('doctor_id', filterDoc);
 const {data:apts=[]} = await q;

 // stash for click handler
 window.__apts = window.__apts || {};
 for (const a of apts){ window.__apts[a.id] = a; }

 const byDay = {};
 for (const a of apts){
 const d = a.date.slice(8,10);
 (byDay[d] = byDay[d]||[]).push(a);
 }

 let cells = '';
 for (let i=0;i<startWeek;i++) cells += `<div class="cal-cell empty"></div>`;
 for (let d=1; d<=daysInMonth; d++){
 const dStr = String(d).padStart(2,'0');
 const evs = byDay[dStr]||[];
 const isToday = (year===new Date().getFullYear() && month===new Date().getMonth() && d===new Date().getDate());
 const dayKey = `${year}-${String(month+1).padStart(2,'0')}-${dStr}`;
 cells += `<div class="cal-cell ${isToday?'today':''}${evs.length?' has-events':''}" data-day="${dayKey}">
 <div class="cal-day">${d}</div>
 <div class="cal-evs">${evs.slice(0,3).map(a=>`<div class="cal-ev ${a.status==='cancelled'?'cancelled':''}" data-apt="${a.id}" title="${escapeHtml((a.clients?.name||'')+' · '+(a.services?.name||''))}">${a.time.slice(0,5)} ${escapeHtml((a.clients?.name||'—').slice(0,12))}</div>`).join('')}${evs.length>3?`<div class="cal-more" data-day-more="${dayKey}">+${evs.length-3} more</div>`:''}</div>
 </div>`;
 }

 return `<div class="panel">
 <div class="panel-head">
 <h3>${escapeHtml(monthLabel)}</h3>
 <div class="row" style="gap:8px">
 ${doctorList.length > 1 ? `<select id="cal-doctor-filter" style="padding:7px 10px;background:var(--bg-2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px">
 <option value="">All doctors</option>
 ${doctorList.map(d=>`<option value="${d.id}" ${filterDoc===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}
 </select>` : ''}
 <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar?m=${offset-1}${filterDoc?'&doctor='+filterDoc:''}">&larr;</a>
 <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar${filterDoc?'?doctor='+filterDoc:''}">Today</a>
 <a class="btn btn-ghost btn-sm" href="#/dashboard/calendar?m=${offset+1}${filterDoc?'&doctor='+filterDoc:''}">&rarr;</a>
 </div>
 </div>
 <div class="panel-body">
 <div class="cal-head">
 <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
 </div>
 <div class="cal-grid">${cells}</div>
 </div>
 </div>`;
}

async function renderClients(){
 const bizId = SESSION.business.id;
 // Pull every client + aggregate counts/totals so the table can show real stats
 const [{data:cls=[]}, {data:apts=[]}, {data:msgs=[]}] = await Promise.all([
 sb.from('clients').select('*').eq('business_id', bizId).order('created_at',{ascending:false}),
 sb.from('appointments').select('id, client_id, date, status, total_amount').eq('business_id', bizId),
 sb.from('messages').select('id, client_id, created_at').eq('business_id', bizId)
 ]);
 // Index aggregates per client_id
 const stat = {};
 cls.forEach(c => stat[c.id] = {visits:0, last:null, spent:0, msgs:0, upcoming:0});
 const today = new Date().toISOString().slice(0,10);
 (apts||[]).forEach(a => {
 const s = stat[a.client_id]; if (!s) return;
 if (a.status !== 'cancelled') {
 s.visits++;
 if (!s.last || a.date > s.last) s.last = a.date;
 if (a.total_amount) s.spent += Number(a.total_amount);
 if (a.date >= today && a.status !== 'cancelled') s.upcoming++;
 }
 });
 (msgs||[]).forEach(m => { const s = stat[m.client_id]; if (s) s.msgs++; });

 const search = `<input id="cli-search" placeholder=" Search by name, phone or email..." style="width:100%;padding:8px 10px;background:transparent;border:1px solid rgba(255,255,255,0.12);border-radius:6px;color:inherit;margin:8px 0" />`;

 const fmtBd = (b) => {
   if (!b) return '<span class="sub">—</span>';
   const d = new Date(b + 'T00:00:00');
   return `<span style="font-weight:600">${d.toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</span> <span class="sub">${d.getFullYear()}</span>`;
 };
 const rows = cls.map(c => {
 const s = stat[c.id] || {visits:0, last:null, spent:0, msgs:0, upcoming:0};
 const lang = (c.profile && c.profile.language) ? c.profile.language : '—';
 return `<tr class="cli-row" data-id="${c.id}" style="cursor:pointer">
 <td><b>${escapeHtml(c.name||'—')}</b>${c.age?` <span class="sub">(${c.age})</span>`:''}</td>
 <td>${escapeHtml(c.phone||'—')}</td>
 <td>${escapeHtml(c.email||'—')}</td>
 <td onclick="event.stopPropagation()">${c.birthday ? fmtBd(c.birthday) : `<button class="btn btn-ghost btn-sm" data-cli-bd="${c.id}" style="font-size:11px;padding:3px 8px;color:var(--primary-2)">+ add</button>`}</td>
 <td><span class="pill blue">${s.visits}</span>${s.upcoming?` <span class="pill green">${s.upcoming} upcoming</span>`:''}</td>
 <td>${s.last||'—'}</td>
 <td>${s.spent>0?`${s.spent.toFixed(0)} TND`:'—'}</td>
 <td>${s.msgs}</td>
 <td><span class="pill gray">${lang}</span></td>
 <td onclick="event.stopPropagation()"><button class="btn btn-ghost btn-sm" data-cli-edit="${c.id}" title="Edit" style="font-size:13px;padding:4px 8px">✎</button></td>
 </tr>`;
 }).join('');

 return `<div class="panel"><div class="panel-head"><h3>Patients (${cls.length})</h3><button class="btn btn-primary btn-sm" id="add-cli">+ New client</button></div>
 <div class="panel-body">${search}</div>
 <div class="panel-body no-pad">${cls.length===0?`<div class="empty"><div class="ic">◉</div>No patients yet</div>`:`
 <table class="data"><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Birthday</th><th>Visits</th><th>Last visit</th><th>Spent</th><th>Msgs</th><th>Lang</th><th></th></tr></thead>
 <tbody>${rows}</tbody></table>`}</div></div>`;
}

 });

 <div style="text-align:center"><div class="sub">Upcoming</div><div style="font-size:1.4em;font-weight:600">${upcoming.length}</div></div>
 <div style="text-align:center"><div class="sub">Spent</div><div style="font-size:1.4em;font-weight:600">${totalSpent.toFixed(0)} TND</div></div>
 ${avgRating ? `<div style="text-align:center"><div class="sub">Rating</div><div style="font-size:1.4em;font-weight:600">${avgRating.toFixed(1)}★</div></div>` : ''}
 </div>

 ${profile.allergies || profile.notes || profile.preferred_doctor || profile.preferred_service ? `

 ${profile.preferred_service?`<div><b>Preferred service:</b> ${escapeHtml(profile.preferred_service)}</div>`:''}
 ${profile.preferred_doctor?`<div><b>Preferred doctor:</b> ${escapeHtml(profile.preferred_doctor)}</div>`:''}

 <h4 style="margin-top:18px"> Appointments (${apts.length})</h4>

 ${isLab && filteredOrders.length ? `

/* ---------- LAB PIPELINE (worker-friendly, grouped by patient) ---------- */
const LAB_NEXT = {requested:'sample_collected', sample_collected:'in_analysis', in_analysis:'ready', ready:'delivered'};
const LAB_PREV = {sample_collected:'requested', in_analysis:'sample_collected', ready:'in_analysis'};
const LAB_NLBL = {requested:'Mark collected', sample_collected:'Start analysis', in_analysis:'Mark ready', ready:'Notify patient'};
const LAB_NICE = {requested:'Requested', sample_collected:'Sample collected', in_analysis:'In analysis', ready:'Ready to send', delivered:'Delivered'};
const LAB_RANK = {requested:0, sample_collected:1, in_analysis:2, ready:3, delivered:4};

async function renderLabPipeline(){
 const bizId = SESSION.business.id;
 const [{data:orders=[]}, {data:kpi}] = await Promise.all([
 sb.from('lab_orders').select(`
 id, status, created_at, collected_at, ready_at, notes, price_charged, appointment_id,
 lab_tests(id, name, code, sample_type, fasting_required, category, reference_range),
 lab_results(id, numeric_value, text_value, unit, is_critical, pdf_path),
 appointments(id, date, time, clients(id, name, phone))
 `).eq('business_id', bizId).order('created_at',{ascending:false}).limit(500),
 sb.from('v_lab_kpis').select('*').eq('business_id', bizId).maybeSingle()
 ]);

 // Group orders by appointment — same patient + same booking time = one batch card
 const groups = {};
 (orders||[]).forEach(o => {
 const k = o.appointment_id || ('orphan_'+o.id);
 if (!groups[k]) groups[k] = {appointment_id:o.appointment_id, tests:[], appointment:o.appointments};
 groups[k].tests.push(o);
 });
 // Each group lives in the column matching its MOST-BEHIND test, so a partly-collected
 // batch stays in "Requested" until every test in it is collected.
 Object.values(groups).forEach(g => {
 g.minRank = Math.min(...g.tests.map(t => LAB_RANK[t.status] ?? 99));
 g.minStatus = Object.keys(LAB_RANK).find(k => LAB_RANK[k] === g.minRank) || 'requested';
 g.hasFasting = g.tests.some(t => t.lab_tests?.fasting_required);
 g.hasCritical = g.tests.some(t => (t.lab_results||[]).some(r => r.is_critical));
 g.hasResults = g.tests.some(t => (t.lab_results||[]).some(r => r.pdf_path || r.numeric_value!==null || (r.text_value && r.text_value.length)));
 g.testIds = g.tests.map(t => t.id);
 });

 const byStatus = {requested:[], sample_collected:[], in_analysis:[], ready:[]};
 Object.values(groups).forEach(g => {
 if (g.minStatus === 'delivered') return;
 if (byStatus[g.minStatus]) byStatus[g.minStatus].push(g);
 });

 const groupCard = (g) => {
 const c = g.appointment?.clients || {};
 const sampleTypes = [...new Set(g.tests.map(t => t.lab_tests?.sample_type).filter(Boolean))];
 const total = g.tests.reduce((a,t) => a + Number(t.price_charged||0), 0);
 const flags = [];
 if (g.hasFasting) flags.push('<span class="pill" style="background:#eab308;color:#000">FASTING</span>');
 if (g.hasCritical) flags.push('<span class="pill" style="background:#ef4444">CRITICAL</span>');
 if (g.hasResults) flags.push('<span class="pill green"> results uploaded</span>');
 const borderColor = g.hasCritical ? '#ef4444' : g.hasFasting ? '#eab308' : '#6366f1';
 const nextStatus = LAB_NEXT[g.minStatus];
 const prevStatus = LAB_PREV[g.minStatus];
 const testList = g.tests.map(t => {
 const dot = LAB_RANK[t.status] > LAB_RANK[g.minStatus] ? '<span style="color:#22c55e"></span>' : '<span style="opacity:.5">○</span>';
 return `${dot} ${escapeHtml(t.lab_tests?.name||'Test')}${t.lab_tests?.code?` <span style="opacity:.6;font-size:.85em">[${escapeHtml(t.lab_tests.code)}]</span>`:''}`;
 }).join('<br>');
 return `<div class="apt-row lab-group" data-aptid="${g.appointment_id||''}" data-ids="${g.testIds.join(',')}" data-status="${g.minStatus}" style="margin:8px 0;padding:12px;background:rgba(99,102,241,0.06);border-radius:8px;border-left:4px solid ${borderColor};cursor:pointer">
 <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
 <div style="flex:1;min-width:0">
 <div style="font-weight:600;font-size:.95em">${escapeHtml(c.name||'—')} <span class="pill blue" style="font-size:.65em;margin-left:4px">${g.tests.length} test${g.tests.length===1?'':'s'}</span></div>
 <div class="sub" style="font-size:.82em;margin-top:3px"> ${escapeHtml(c.phone||'—')}</div>
 <div class="sub" style="font-size:.78em;opacity:.75;margin-top:2px"> ${g.appointment?.date||''} ${(g.appointment?.time||'').slice(0,5)} · ${sampleTypes.join(', ')||'—'} · ${total||0} TND</div>
 <div class="sub" style="font-size:.8em;margin-top:8px;line-height:1.6">${testList}</div>
 ${flags.length?`<div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap">${flags.join('')}</div>`:''}
 </div>
 </div>
 <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
 ${nextStatus ? `<button class="btn-primary lab-group-advance" data-ids="${g.testIds.join(',')}" data-aptid="${g.appointment_id||''}" data-to="${nextStatus}" style="font-size:.8em;padding:6px 10px;flex:1">${LAB_NLBL[g.minStatus]} all →</button>` : ''}
 ${g.minStatus === 'ready' ? `<button class="btn-ghost lab-group-pickedup" data-ids="${g.testIds.join(',')}" style="font-size:.74em;padding:6px 8px" title="Patient picked up in person — archive without sending WhatsApp"> Picked up</button>` : ''}
 ${prevStatus ? `<button class="btn-ghost lab-group-revert" data-ids="${g.testIds.join(',')}" data-to="${prevStatus}" style="font-size:.74em;padding:6px 8px" title="Revert all">← undo</button>` : ''}
 </div>
 </div>`;
 };

 const col = (title, list, status)=>{
 const totalTests = list.reduce((a,g)=>a+g.tests.length, 0);
 const bulkBtn = LAB_NEXT[status] && list.length
 ? `<button class="btn-primary lab-bulk" data-from="${status}" data-to="${LAB_NEXT[status]}" style="width:100%;margin-top:10px;font-size:.82em"> ${LAB_NLBL[status]} all (${totalTests} test${totalTests===1?'':'s'} across ${list.length} patient${list.length===1?'':'s'})</button>` : '';
 return `<div class="panel"><div class="panel-head"><h3>${title} <span class="pill ${list.length?'blue':'gray'}">${list.length} patient${list.length===1?'':'s'}</span></h3></div>
 <div class="panel-body" style="max-height:65vh;overflow:auto">${list.length?list.map(groupCard).join(''):'<div class="empty"><div class="ic">⌀</div>Empty</div>'}${bulkBtn}</div></div>`;
 };

 // ---- Live patient queue (queue_pack.sql) ----
 let queueData = [];
 let queueAvg = 8;
 let queueAvailable = true;
 try {
   const qr = await sb.from('v_queue_today').select('*').eq('business_id', bizId);
   if (qr.error) { queueAvailable = false; }
   else queueData = qr.data || [];
   if (queueData.length) {
     const completedDurations = queueData.filter(q=>q.served_min!=null).map(q=>q.served_min);
     if (completedDurations.length) queueAvg = Math.round(completedDurations.reduce((a,b)=>a+b,0)/completedDurations.length);
   }
 } catch (_e) { queueAvailable = false; }

 const waiting = queueData.filter(q => q.status === 'waiting').sort((a,b)=>(a.queue_pos||999)-(b.queue_pos||999));
 const inProgress = queueData.find(q => q.status === 'in_progress');
 const queueUrl = `${location.origin}/pwa/queue.html?b=${encodeURIComponent(bizId)}`;
 const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data=${encodeURIComponent(queueUrl)}`;

 const queuePanel = !queueAvailable
   ? `<div class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>Live queue — setup needed</h3></div>
      <div class="panel-body" style="font-size:13.5px;line-height:1.6;color:var(--text-dim)">
        Apply <span class="code">supabase/migrations/queue_pack.sql</span> in Supabase Studio → SQL Editor to enable the live waiting-room queue.
      </div></div>`
   : `<div class="panel" style="margin-bottom:14px;background:linear-gradient(135deg,rgba(99,102,241,0.10),rgba(34,211,238,0.06));border:1px solid color-mix(in srgb,var(--primary) 30%,transparent)">
        <div class="panel-head" style="border-bottom:1px solid var(--border)">
          <h3 style="display:flex;align-items:center;gap:10px"><span style="font-size:18px">◷</span> Live queue · ${waiting.length} waiting${inProgress ? ' · 1 with technician' : ''}</h3>
          <div class="row" style="gap:8px">
            <button class="btn btn-secondary btn-sm" id="lq-show-qr">Show reception QR</button>
            <button class="btn btn-primary btn-sm" id="lq-call-next" ${waiting.length===0 || inProgress ? 'disabled':''}>Call next →</button>
          </div>
        </div>
        <div class="panel-body" style="padding:12px 18px">
          ${inProgress ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-radius:11px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid var(--accent);margin-bottom:10px">
            <div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700">CURRENTLY WITH TECHNICIAN</div>
              <div style="font-weight:700;font-size:15px;margin-top:3px">${escapeHtml(inProgress.name||'')}</div>
              <div style="font-size:12px;color:var(--text-dim)">${escapeHtml(inProgress.phone||'')} · called at ${new Date(inProgress.called_at).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</div>
            </div>
            <button class="btn btn-primary btn-sm" id="lq-complete" data-id="${inProgress.id}">Mark done</button>
          </div>` : ''}
          ${waiting.length === 0 ? `<div class="empty" style="padding:18px"><div class="ic">⌀</div>Nobody waiting. Patients scan the reception QR to join.</div>` :
            `<div style="display:grid;grid-template-columns:1fr;gap:6px">
              ${waiting.slice(0,8).map((q,i) => {
                const eta = i * queueAvg;
                return `<div style="display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--card-2);border:1px solid var(--border)">
                  <div style="font-size:18px;font-weight:700;color:var(--primary-2);text-align:center">#${q.queue_pos}</div>
                  <div style="min-width:0"><div style="font-weight:600;font-size:13.5px">${escapeHtml(q.name||'')}</div>
                    <div style="font-size:11.5px;color:var(--text-dim)">${escapeHtml(q.phone||'')} · waiting ${Math.max(0,Math.round((Date.now()-new Date(q.joined_at).getTime())/60000))} min</div>
                  </div>
                  <span class="pill ${i===0?'green':'blue'}">~${eta} min</span>
                </div>`;
              }).join('')}
              ${waiting.length>8?`<div class="sub" style="padding:6px 4px">+ ${waiting.length-8} more waiting</div>`:''}
            </div>`}
        </div>
      </div>`;

 return queuePanel + `<div class="panel" style="margin-bottom:14px"><div class="panel-body" style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px">
 <div><div class="sub">Awaiting collection</div><div style="font-size:1.6em;font-weight:600">${kpi?.awaiting_collection||0}</div></div>
 <div><div class="sub">Awaiting analysis</div><div style="font-size:1.6em;font-weight:600">${kpi?.awaiting_analysis||0}</div></div>
 <div><div class="sub">In analysis</div><div style="font-size:1.6em;font-weight:600">${kpi?.in_analysis||0}</div></div>
 <div><div class="sub">Ready to send</div><div style="font-size:1.6em;font-weight:600">${kpi?.ready_to_send||0}</div></div>
 <div><div class="sub">Avg turnaround (h)</div><div style="font-size:1.6em;font-weight:600">${kpi?.avg_tat_hours||0}</div></div>
 </div></div>

async function bindLabPipeline(){
 const bizId = SESSION.business.id;
 // Reception QR modal
 const showQrBtn = document.getElementById('lq-show-qr');
 if (showQrBtn) showQrBtn.onclick = () => {
   const queueUrl = `${location.origin}/pwa/queue.html?b=${encodeURIComponent(bizId)}`;
   const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=12&data=${encodeURIComponent(queueUrl)}`;
   openModal(`<div style="text-align:center">
     <h3 style="margin:0 0 6px">Reception QR</h3>
     <p class="sub" style="margin:0 0 14px;font-size:13.5px">Print this and stick it at the reception desk. Patients scan it to join the queue and watch their position update live.</p>
     <div style="background:white;display:inline-block;padding:14px;border-radius:14px;box-shadow:0 8px 24px rgba(99,102,241,0.3)">
       <img src="${qrSrc}" alt="Reception QR" style="display:block;width:300px;height:300px" />
     </div>
     <div class="sub" style="margin:14px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px">Or share this link directly</div>
     <div class="code" style="word-break:break-all;font-size:11.5px;padding:8px 10px">${queueUrl}</div>
     <div class="row" style="margin-top:18px;justify-content:flex-end">
       <button class="btn btn-secondary" onclick="window.print()">Print</button>
       <button class="btn btn-secondary" onclick="closeModal()" style="margin-left:8px">Close</button>
     </div>
   </div>`);
 };
 // Call next: claim the oldest waiting entry
 const callBtn = document.getElementById('lq-call-next');
 if (callBtn) callBtn.onclick = async () => {
   callBtn.disabled = true; callBtn.textContent = 'Calling...';
   const { data, error } = await sb.rpc('queue_call_next', { p_business_id: bizId });
   if (error) { toast({title:'Could not call next', message:error.message, urgent:true}); callBtn.disabled = false; callBtn.textContent = 'Call next →'; return; }
   const next = Array.isArray(data) && data[0];
   if (next) toast({title:'Calling ' + (next.name||'next patient'), message:'Their PWA just lit up.', type:'booking'});
   render();
 };
 // Mark done
 const doneBtn = document.getElementById('lq-complete');
 if (doneBtn) doneBtn.onclick = async () => {
   doneBtn.disabled = true;
   const { error } = await sb.rpc('queue_complete', { p_entry_id: doneBtn.dataset.id });
   if (error) { toast({title:'Could not mark done', message:error.message, urgent:true}); doneBtn.disabled = false; return; }
   toast({title:'Visit completed', message:'Queue moved up.', type:'info'});
   render();
 };
 // Realtime: re-render the lab page whenever the queue changes
 if (window.__labQueueChan) { try { sb.removeChannel(window.__labQueueChan); } catch(_e){} }
 window.__labQueueChan = sb.channel('lab-queue:'+bizId)
   .on('postgres_changes', { event:'*', schema:'public', table:'queue_entries', filter:`business_id=eq.${bizId}` },
       () => { if (location.hash.includes('/dashboard/lab')) render(); })
   .subscribe();

 const setStatus = async (id, to) => {
 const upd = {status: to};
 if (to === 'sample_collected') upd.collected_at = new Date().toISOString();
 if (to === 'in_analysis') upd.analysed_at = new Date().toISOString();
 if (to === 'ready') upd.ready_at = new Date().toISOString();
 if (to === 'delivered') upd.delivered_at = new Date().toISOString();
 return sb.from('lab_orders').update(upd).eq('id', id);
 };

 const setStatusBatch = async (ids, to) => {
 const upd = {status: to};
 if (to === 'sample_collected') upd.collected_at = new Date().toISOString();
 if (to === 'in_analysis') upd.analysed_at = new Date().toISOString();
 if (to === 'ready') upd.ready_at = new Date().toISOString();
 if (to === 'delivered') upd.delivered_at = new Date().toISOString();
 return sb.from('lab_orders').update(upd).in('id', ids);
 };

 const to = b.getAttribute('data-to');
 b.disabled = true; b.textContent = '...';
 if (to === 'delivered') {

 });

async function bindPackages(){
 const bizId = SESSION.business.id;
 const {data:svcs=[]} = await sb.from('services').select('id, name').eq('business_id', bizId);

 const open = (p)=>{
 const svcOpts = `<option value="">Any service</option>${svcs.map(s=>`<option value="${s.id}" ${p?.service_id===s.id?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}`;
 openModal(`<form id="pkg-form"><h3>${p?'Edit':'New'} package</h3>
 <div class="field"><label>Name *</label><input name="name" required value="${escapeHtml(p?.name||'')}" placeholder="e.g. 10-session physiotherapy plan" /></div>
 <div class="field"><label>Description</label><input name="description" value="${escapeHtml(p?.description||'')}" placeholder="What's included, who it's for" /></div>
 <div class="row">
 <div class="field grow"><label>Service this covers</label><select name="service_id">${svcOpts}</select></div>
 <div class="field"><label>Sessions *</label><input name="total_sessions" type="number" min="1" value="${p?.total_sessions||10}" required /></div>
 </div>
 <div class="row">
 <div class="field grow"><label>Price (TND) *</label><input name="price" type="number" step="0.5" value="${p?.price||0}" required /></div>
 <div class="field"><label>Validity (days)</label><input name="validity_days" type="number" min="1" value="${p?.validity_days||365}" /></div>
 <div class="field"><label>Discount %</label><input name="discount_percent" type="number" min="0" max="100" value="${p?.discount_percent||0}" /></div>
 </div>
 <div class="modal-actions"><button type="button" class="btn-ghost" id="m-cancel">Cancel</button>
 ${p?`<button type="button" class="btn-ghost" id="m-del" style="color:#ef4444">Delete</button>`:''}
 <button class="btn-primary">Save</button></div>
 </form>`, async ()=>{
 const fd = Object.fromEntries(new FormData($('#pkg-form')).entries());
 const row = {
 business_id: bizId,
 name: fd.name,
 description: fd.description || null,
 service_id: fd.service_id || null,
 total_sessions: parseInt(fd.total_sessions||'10', 10),
 price: parseFloat(fd.price||'0'),
 currency: 'TND',
 validity_days: parseInt(fd.validity_days||'365', 10),
 discount_percent: fd.discount_percent ? parseInt(fd.discount_percent,10) : null,
 active: true,
 };
 if (p) await sb.from('service_packages').update(row).eq('id', p.id);
 else await sb.from('service_packages').insert(row);
 toast({title: p?'Package updated':'Package created', message:'Saved.', type:'booking'});
 await render();
 });
 setTimeout(()=>{
 const del = $('#m-del');
 if (del && p) del.onclick = async ()=>{
 if (!confirm('Delete this package? Existing purchases keep working.')) return;
 await sb.from('service_packages').delete().eq('id', p.id);
 closeModal(); await render();
 };
 }, 50);
 };

 $('#add-pkg').onclick = () => open(null);

 document.querySelectorAll('[data-pkg-edit]').forEach(b => b.onclick = async () => {
 const id = b.getAttribute('data-pkg-edit');
 const {data:p} = await sb.from('service_packages').select('*').eq('id', id).single();
 open(p);
 });

 document.querySelectorAll('[data-pkg-toggle]').forEach(b => b.onclick = async () => {
 const id = b.getAttribute('data-pkg-toggle');
 const wasActive = b.getAttribute('data-active') === 'true';
 await sb.from('service_packages').update({ active: !wasActive }).eq('id', id);
 toast({ title: wasActive ? 'Paused' : 'Activated', message: 'Package status updated.', type:'info' });
 await render();
 });

 document.querySelectorAll('[data-pkg-share]').forEach(b => b.onclick = async () => {
 const id = b.getAttribute('data-pkg-share');
 const name = b.getAttribute('data-name');
 const link = `https://wa.me/${(SESSION.business.phone||'').replace(/\D/g,'')}?text=${encodeURIComponent('I want to buy: ' + name)}`;
 try {
 await navigator.clipboard.writeText(link);
 toast({ title:'Copied', message:'Share this link on Instagram, FB, business cards. Customers tap → message Nova → get a checkout link.', type:'info' });
 } catch {
 prompt('Share link:', link);
 }
 });

 /* Activate a pending purchase: flip status to active, set sessions_remaining
 and expires_at from the package config, send the patient a receipt. */
 document.querySelectorAll('[data-pp-activate]').forEach(b => b.onclick = async () => {
 const id = b.getAttribute('data-pp-activate');
 const note = prompt('Payment method note (optional — e.g. "cash", "bank transfer"):', 'cash');
 if (note === null) return;
 const {data: pp} = await sb.from('package_purchases').select('*, service_packages(name, total_sessions, validity_days, price, currency), clients(name, phone)').eq('id', id).maybeSingle();
 if (!pp) { toast({title:'Not found', urgent:true}); return; }
 const total = pp.service_packages?.total_sessions || 1;
 const validity = pp.service_packages?.validity_days || 365;
 const expires_at = new Date(Date.now() + validity*86400*1000).toISOString();
 const {error} = await sb.from('package_purchases').update({
 status: 'active',
 sessions_remaining: total,
 sessions_used: 0,
 paid_at: new Date().toISOString(),
 expires_at,
 notes: note ? note : null,
 }).eq('id', id);
 if (error) { toast({title:'Failed', message:error.message, urgent:true}); return; }
 toast({title:' Activated', message:`${total} sessions for ${pp.service_packages?.name}`, type:'booking'});
 // Send receipt to patient
 try {
 const phone = (pp.clients?.phone||'').replace(/^\+/,'');
 if (phone && SESSION.business.phone) {
 const cName = (pp.clients?.name||'').split(' ')[0] || 'there';
 const body = ` Hi ${cName}, your package is now active!\n\n ${pp.service_packages?.name}\n ${total} sessions, valid ${validity} days\n Paid (${note||'manual'})\n\nReply BOOK any time — Nova will deduct from your package automatically.`;
 // Use the existing test infrastructure via classify-message? Simpler: send via WhatsApp through a direct fetch from the OWNER side… Actually we don't have a direct WA send from the dashboard. We rely on the next inbound from the patient.
 await sb.from('messages').insert({ business_id: SESSION.business.id, client_id: pp.client_id, direction: 'out', channel: 'whatsapp', text: body, intent: 'package_activated' });
 }
 } catch (_e) {}
 await render();
 });

 document.querySelectorAll('[data-pp-cancel]').forEach(b => b.onclick = async () => {
 if (!confirm('Cancel this pending purchase?')) return;
 const id = b.getAttribute('data-pp-cancel');
 await sb.from('package_purchases').update({ status: 'cancelled' }).eq('id', id);
 await render();
 });

 /* Sell manually — owner picks a package + a client, creates an active
 purchase row directly. Used when the customer pays in person/cash/bank. */
 const sellBtn = $('#sell-manual');
 if (sellBtn) sellBtn.onclick = async () => {
 if (!pkgs || pkgs.length === 0) { toast({title:'No packages yet', message:'Create a package first.', urgent:true}); return; }
 const {data: clients = []} = await sb.from('clients').select('id, name, phone').eq('business_id', bizId).order('created_at', {ascending:false}).limit(200);
 const pkgOpts = pkgs.filter(p=>p.active).map(p=>`<option value="${p.id}">${escapeHtml(p.name)} — ${p.total_sessions} sessions · ${p.price} ${p.currency||'TND'}</option>`).join('');
 const cliOpts = clients.map(c=>`<option value="${c.id}">${escapeHtml(c.name||c.phone)} (${escapeHtml(c.phone||'')})</option>`).join('');
 openModal(`<form id="sell-form"><h3>Sell a package manually</h3>
 <p class="sub">Use this when a customer pays in cash, by bank transfer, or in person. Activates the package immediately.</p>
 <div class="field"><label>Package *</label><select name="package_id" required>${pkgOpts}</select></div>
 <div class="field"><label>Client *</label><select name="client_id" required>${cliOpts || '<option value="">— no clients yet —</option>'}</select></div>
 <div class="field"><label>Payment method</label><select name="method">
 <option value="cash">Cash</option><option value="bank_transfer">Bank transfer</option><option value="card">Card on site</option><option value="other">Other</option>
 </select></div>
 <div class="field"><label>Notes (optional)</label><input name="notes" placeholder="receipt #, voucher code, etc." /></div>
 <div class="modal-actions"><button type="button" class="btn-ghost" id="m-cancel">Cancel</button><button class="btn-primary">Activate package</button></div>
 </form>`, async () => {
 const fd = Object.fromEntries(new FormData($('#sell-form')).entries());
 if (!fd.package_id || !fd.client_id) { toast({title:'Pick a package and a client', urgent:true}); return; }
 const pkg = pkgs.find(p=>p.id===fd.package_id);
 const validity = pkg?.validity_days || 365;
 const total = pkg?.total_sessions || 1;
 const {error} = await sb.from('package_purchases').insert({
 business_id: bizId,
 client_id: fd.client_id,
 package_id: fd.package_id,
 status: 'active',
 sessions_remaining: total,
 sessions_used: 0,
 paid_at: new Date().toISOString(),
 expires_at: new Date(Date.now() + validity*86400*1000).toISOString(),
 payment_provider: fd.method || 'manual',
 notes: fd.notes || null,
 });
 if (error) { toast({title:'Failed', message:error.message, urgent:true}); return; }
 toast({title:' Sold', message:`${total} sessions activated for the customer.`, type:'booking'});
 await render();
 });
 };
}

// =============== ASK NOVA - persistent voice partner with wake word ======
let __novaVoices = null;
window.__nova = window.__nova || { overlay: null, alwaysOn: false, lastLang: 'en', minimized: false };

function loadVoices(){
  return new Promise(resolve => {
    let v = window.speechSynthesis.getVoices();
    if (v && v.length){ __novaVoices = v; resolve(v); return; }
    window.speechSynthesis.onvoiceschanged = () => {
      v = window.speechSynthesis.getVoices();
      __novaVoices = v;
      resolve(v);
    };
    setTimeout(() => { __novaVoices = window.speechSynthesis.getVoices() || []; resolve(__novaVoices); }, 1500);
  });
}

function playWakeBeep(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(880, ctx.currentTime);          // A5 ping
    o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);  // up to E6
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.2);
  } catch(_e){}
}

function pickNovaVoice(lang){
  const voices = __novaVoices || window.speechSynthesis.getVoices() || [];
  const preferred = {
    en: ["Google UK English Male","Microsoft Ryan Online","Microsoft Guy Online","Microsoft George","Microsoft Mark","Microsoft David","Daniel","Daniel (Enhanced)","Alex","Albert","Arthur","Google US English"],
    fr: ["Google français","Microsoft Paul Online","Microsoft Henri Online","Microsoft Claude","Thomas","Thomas (Enhanced)","Nicolas"],
    ar: ["Microsoft Hamed Online","Microsoft Naayf","Maged","Maged (Enhanced)","Tarik","Hassan"],
  };
  const prefList = preferred[lang] || preferred.en;
  for (const name of prefList){
    const v = voices.find(v => v.name === name || v.name.includes(name));
    if (v) return v;
  }
  const langPrefix = lang === "ar" ? "ar" : lang === "fr" ? "fr" : "en";
  const maleish = voices.find(v => (v.lang || "").startsWith(langPrefix) && /male|man|guy|david|ryan|paul|thomas|tarik/i.test(v.name));
  if (maleish) return maleish;
  const anyLang = voices.find(v => (v.lang || "").startsWith(langPrefix));
  if (anyLang) return anyLang;
  return voices[0];
}

// Aggressive wake-word detector. Browser SR mishears "Nova" CONSTANTLY, so
// we match a wide net of variants and fuzzy spellings, on both interim and
// final transcripts. Returns the question after the wake word, or null.
const WAKE_VARIANTS = [
  // Canonical
  "nova","novah","novaa","noova","nouva","nouvah",
  // Common SR mishearings
  "no va","noh va","oh va","ova","ovah","know va","know ah","newa","neva","newva",
  "nofa","noofa","nofah","nuova","noevah","nofa","no fa","no var","nover",
  // Arabic transliteration
  "noufa","noufah","nofa",
];
const WAKE_PREFIXES = [
  "hey","hi","hello","salut","bonjour","yo","ok","hay","ya","hé","eh","hé","ey",
  "yes","oh","ah","",
];

function extractAfterWakeWord(text){
  if (!text) return null;
  // Normalise: strip diacritics, lowercase, collapse punctuation/whitespace
  let s = text.toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // strip accents
    .replace(/[.,!?;:،؟]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  // Direct Arabic "نوفا" still in the original text — keep as a separate check
  const arabic = /نوفا|نوف[ا]?/.test(text);
  if (arabic){
    const idx = text.search(/نوفا|نوف[ا]?/);
    const tail = idx >= 0 ? text.slice(idx + 4).trim() : "";
    return tail.length >= 2 ? tail : "__WAKE_ONLY__";
  }
  // Try every (prefix + variant) combo, longest first so "hey nova" beats "nova"
  const tries = [];
  for (const v of WAKE_VARIANTS){
    for (const p of WAKE_PREFIXES){
      tries.push(p ? `${p} ${v}` : v);
    }
  }
  tries.sort((a,b) => b.length - a.length);  // longest match first
  for (const phrase of tries){
    // Build a tolerant regex: word boundaries optional, allow spaces between letters
    const escaped = phrase.replace(/\s+/g, "\\s*").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const re = new RegExp(`(^|[^a-z])${escaped}([^a-z]|$)`, "i");
    const m = s.match(re);
    if (m){
      const after = s.slice(m.index + m[0].length).trim();
      if (after.length >= 2) return after;
      return "__WAKE_ONLY__";
    }
  }
  return null;
}

   u.lang = u.voice ? u.voice.lang : (lang === 'ar' ? 'ar-SA' : lang === 'fr' ? 'fr-FR' : 'en-GB');
   u.rate = 0.88;
   u.pitch = 0.78;
   u.volume = 1.0;
   u.onstart = () => setState('speaking', 'Speaking...', 'live');
   u.onend = () => {
     setState(null, '', '');
     // After Nova finishes speaking, immediately reopen the mic if active
     if (window.__nova.alwaysOn && !isProcessing) setTimeout(() => listenForQuestion(), 300);
   };
   TTS.speak(u);
 }

 function parseAnswer(raw){
   const m = (raw || '').match(/^\s*\[LANG=(en|fr|ar)\]\s*([\s\S]*)$/i);
   if (m) return { lang: m[1].toLowerCase(), text: m[2].trim() };
   return { lang: window.__nova.lastLang || 'en', text: (raw || '').trim() };
 }

 async function askClaude(transcript){
   if (!transcript) return;
   isProcessing = true;
   setState('thinking', 'Thinking...', 'live');
   try {
     const r = await fetch(`${CFG.supabaseUrl}/functions/v1/ask-nova`, {
       method:'POST',
       headers:{ 'Content-Type':'application/json', 'Authorization': `Bearer ${CFG.supabaseAnonKey}` },
       body: JSON.stringify({ business_id: SESSION.business.id, transcript }),
     });
     const j = await r.json();
     if (!r.ok || !j.ok) throw new Error(j.error || 'Network error');
     const { lang, text } = parseAnswer(j.answer);
     window.__nova.lastLang = lang;
     setPrompt(transcript, text);
     speak(text, lang);
   } catch (e){
     setState(null, 'Error', '');
     setPrompt(transcript, 'Sorry, I could not reach you: ' + e.message);
   } finally { isProcessing = false; }
 }

 // --- Mode 1: One-shot question listening (after tap or after wake word) ---
 function listenForQuestion(){
   if (!supportsVoice){
     const text = prompt("Voice not supported. Type your question:");
     if (text) askClaude(text);
     return;
   }
   try { TTS.cancel(); } catch(_e){}
   try { if (wakeRec) wakeRec.stop(); } catch(_e){}
   try { if (questionRec) questionRec.abort(); } catch(_e){}
   mode = "listening";
   questionRec = new SR();
   questionRec.continuous = false;
   questionRec.interimResults = true;
   questionRec.lang = srLocales[window.__nova.lastLang] || "fr-FR";
   let lastUserText = '';
   questionRec.onstart = () => setState('listening', 'Listening...', 'live');
   questionRec.onresult = (e) => {
     let interim = '', final = '';
     for (let i = e.resultIndex; i < e.results.length; i++){
       const t = e.results[i][0].transcript;
       if (e.results[i].isFinal) final += t; else interim += t;
     }
     if (interim) setPrompt(interim, '');
     if (final) lastUserText = final;
   };
   questionRec.onerror = (e) => { setState(null, 'Mic: ' + e.error, ''); mode = "idle"; };
   questionRec.onend = () => {
     mode = "idle";
     if (lastUserText) askClaude(lastUserText);
     else if (window.__nova.alwaysOn) setTimeout(() => listenForQuestion(), 300);
     else setState(null, 'Tap the orb to talk again', '');
   };
   try { questionRec.start(); } catch(_e){}
 }

 // --- ACTIVE mode: continuous listening (no wake word) ---
 // When the toggle is ON, the mic just stays open and listens for any speech.
 // After Nova answers, the mic reopens automatically.
 function startWakeListening(){
   if (!supportsVoice){
     setState(null, 'Voice not supported in this browser', '');
     return;
   }
   if (!window.__nova.alwaysOn){
     setState(null, 'Tap the orb to talk', '');
     return;
   }
   if (isProcessing){
     setTimeout(() => startWakeListening(), 400);
     return;
   }
   // In ACTIVE mode we just keep listenForQuestion() running in a loop.
   listenForQuestion();
 }

 orbWrap.onclick = () => {
   if (overlay.classList.contains('minimized')){
     overlay.classList.remove('minimized');
     window.__nova.minimized = false;
     return;
   }
   titleEl.textContent = 'I am listening...';
   listenForQuestion();
 };

 toggle.onclick = () => {
   window.__nova.alwaysOn = !window.__nova.alwaysOn;
   toggle.classList.toggle('on', window.__nova.alwaysOn);
   toggleState.textContent = window.__nova.alwaysOn ? 'ON' : 'OFF';
   if (window.__nova.alwaysOn){
     // Start listening immediately — mic stays open continuously
     listenForQuestion();
   } else {
     // Stop any active recognizer
     try { if (wakeRec) wakeRec.stop(); } catch(_e){}
     try { if (questionRec) questionRec.abort(); } catch(_e){}
     try { TTS.cancel(); } catch(_e){}
     setState(null, 'Tap the orb to talk', '');
   }
 };

 const minimize = () => {
   overlay.classList.add('minimized');
   window.__nova.minimized = true;
 };
 minBtn.onclick = minimize;

 const close = () => {
   try { if (wakeRec) wakeRec.abort(); } catch(_e){}
   try { if (questionRec) questionRec.abort(); } catch(_e){}
   try { TTS.cancel(); } catch(_e){}
   overlay.remove();
   window.__nova.overlay = null;
   window.__nova.alwaysOn = false;
   window.__nova.minimized = false;
 };
 closeBtn.onclick = close;
 stopBtn.onclick = () => {
   try { if (wakeRec) wakeRec.abort(); } catch(_e){}
   try { if (questionRec) questionRec.abort(); } catch(_e){}
   try { TTS.cancel(); } catch(_e){}
   isProcessing = false;
   setState(null, 'Stopped', '');
 };
 // "Talk now" — bypass the wake word entirely, listen for a question immediately
 const talkNow = overlay.querySelector('#an-talk-now');
 if (talkNow) talkNow.onclick = () => {
   try { if (wakeRec) wakeRec.abort(); } catch(_e){}
   try { TTS.cancel(); } catch(_e){}
   listenForQuestion();
 };
 const escHandler = (e) => {
   if (e.key === 'Escape'){
     if (overlay.classList.contains('minimized')){
       close();
       document.removeEventListener('keydown', escHandler);
     } else {
       minimize();
     }
   }
 };
 document.addEventListener('keydown', escHandler);

 setTimeout(() => speak("Hey boss. How can I help?", 'en'), 400);
}

async function openDashScanner(){
 const html = `<div style="text-align:center;min-width:320px">
   <h3 style="margin:0 0 6px">Scan patient QR</h3>
   <p style="margin:0 0 16px;color:var(--text-dim);font-size:13.5px">Hold the patient's QR up to your camera. No camera? Type the token manually.</p>
   <div id="dash-qr-reader" style="width:100%;max-width:380px;margin:0 auto;border-radius:14px;overflow:hidden;border:2px solid var(--primary);min-height:60px"></div>
   <div id="dash-qr-msg" style="margin-top:12px;font-size:13px;color:var(--warn);min-height:18px"></div>
   <div style="margin:18px auto 0;max-width:380px;text-align:left">
     <div style="font-size:11.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;font-weight:600">Or enter the token manually</div>
     <div class="row" style="gap:8px">
       <input id="dash-qr-manual" placeholder="Paste check-in token" style="flex:1;padding:10px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px" />
       <button class="btn btn-primary btn-sm" id="dash-qr-go">Start</button>
     </div>
   </div>
   <div class="row" style="justify-content:center;margin-top:18px"><button class="btn btn-secondary" onclick="closeDashScanner()">Cancel</button></div>
 </div>`;
 openModal(html);
 const setMsg = (text, color) => {
   const el = document.getElementById('dash-qr-msg');
   if (el){ el.textContent = text; el.style.color = color || 'var(--warn)'; }
 };
 // Wire the manual entry — works even if the camera library can't load
 const goBtn = document.getElementById('dash-qr-go');
 const inp = document.getElementById('dash-qr-manual');
 if (goBtn && inp){
   const submit = async () => {
     const token = (inp.value || '').trim();
     if (!token) { setMsg('Paste a token first.', 'var(--warn)'); return; }
     await closeDashScanner();
     startDashConsultation(token);
   };
   goBtn.onclick = submit;
   inp.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') submit(); });
 }

 // Try to load the camera scanner library
 const ok = await loadQrLib();
 if (!ok){
   setMsg('Camera scanner could not load — use manual entry below.', 'var(--warn)');
   return;
 }
 try {
   const reader = new Html5Qrcode("dash-qr-reader");
   window.__dashQr = reader;
   let scanning = true;
   await reader.start(
     { facingMode: 'environment' },
     { fps: 10, qrbox: { width: 240, height: 240 } },
     async (decoded) => {
       if (!scanning) return;
       scanning = false;
       let token = decoded;
       try { const u = new URL(decoded); token = u.searchParams.get('qr') || u.searchParams.get('a') || decoded; } catch(_e){}
       setMsg('QR detected — starting visit...', 'var(--accent)');
       await closeDashScanner();
       startDashConsultation(token);
     },
     ()=>{}
   );
 } catch (e){
   setMsg('Could not access camera: ' + (e.message||'permission denied') + ' — use manual entry below.', 'var(--danger)');
 }
}
window.closeDashScanner = async function(){
 try { if (window.__dashQr) await window.__dashQr.stop(); } catch(_e){}
 window.__dashQr = null;
 closeModal();
};

async function startDashConsultation(token){
 try {
   const docId = sessionStorage.getItem('view_doctor_id') || (SESSION?.member?.id ?? null);
   const { data, error } = await sb.rpc('apt_start_consultation', { p_token: token, p_doctor_id: docId });
   if (error) throw error;
   if (!data || !data.length) throw new Error('Appointment not found');
   const a = data[0];
   DASH_CT_STATE = {
     aptId: a.appointment_id,
     name: a.client_name,
     service: a.service_name,
     phone: a.client_phone,
     arrivedAt: new Date(a.arrived_at).getTime(),
     tickHandle: null,
   };
   renderDashConsultation();
 } catch (e){
   toast({title:'Could not start consultation', message: e.message || 'Invalid QR', urgent:true});
 }
}

function renderDashConsultation(){
 const host = document.getElementById('ct-overlay-host');
 if (!host || !DASH_CT_STATE) return;
 host.innerHTML = `<div class="panel" style="margin-bottom:18px;background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(139,92,246,0.08));border:1px solid color-mix(in srgb,var(--primary) 40%,transparent);box-shadow:0 12px 40px -8px rgba(99,102,241,0.4)">
   <div class="panel-body" style="display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:24px">
     <div style="min-width:0">
       <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--primary-2);font-weight:700;margin-bottom:6px">CONSULTATION IN PROGRESS</div>
       <h2 style="margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.3px">${escapeHtml(DASH_CT_STATE.name||'—')}</h2>
       <div style="color:var(--text-dim);font-size:13.5px">${escapeHtml(DASH_CT_STATE.service||'')}${DASH_CT_STATE.phone?` · ${escapeHtml(DASH_CT_STATE.phone)}`:''}</div>
       <div style="margin-top:12px;font-size:12.5px;color:var(--text-faint)">Started <span id="ct-started-d">—</span></div>
     </div>
     <div style="text-align:center;min-width:180px">
       <div id="ct-timer-d" style="font-size:48px;font-weight:200;letter-spacing:-1.5px;line-height:1;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent">00:00</div>
       <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600;margin:6px 0 14px">elapsed</div>
       <button class="btn btn-danger" id="ct-end-btn-d" style="background:linear-gradient(135deg,#ef4444,#dc2626);color:white;font-weight:700;padding:12px 22px;border-radius:10px;border:0;cursor:pointer;box-shadow:0 6px 18px rgba(239,68,68,0.4)">End consultation</button>
     </div>
   </div>
 </div>`;
 const start = DASH_CT_STATE.arrivedAt;
 const startedEl = document.getElementById('ct-started-d');
 if (startedEl) startedEl.textContent = new Date(start).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
 const tick = () => {
   const el = document.getElementById('ct-timer-d');
   if (!el || !DASH_CT_STATE) return;
   const ms = Date.now() - start;
   const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
   el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 };
 tick();
 if (DASH_CT_STATE.tickHandle) clearInterval(DASH_CT_STATE.tickHandle);
 DASH_CT_STATE.tickHandle = setInterval(tick, 1000);

 document.getElementById('ct-end-btn-d').onclick = async () => {
   const btn = document.getElementById('ct-end-btn-d');
   btn.disabled = true; btn.textContent = 'Ending...';
   try {
     const { data, error } = await sb.rpc('apt_end_consultation', { p_appointment_id: DASH_CT_STATE.aptId });
     if (error) throw error;
     const dur = (data && data[0]?.actual_duration_min) || Math.floor((Date.now() - start) / 60000);
     clearInterval(DASH_CT_STATE.tickHandle);
     const name = DASH_CT_STATE.name;
     DASH_CT_STATE = null;
     host.innerHTML = `<div class="panel" style="margin-bottom:18px;background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid var(--accent)">
       <div class="panel-body" style="text-align:center;padding:24px">
         <div style="font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);font-weight:700;margin-bottom:6px">VISIT COMPLETED</div>
         <div style="font-size:36px;font-weight:200;letter-spacing:-1px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0 4px">${dur} min</div>
         <div style="color:var(--text-dim);font-size:13.5px">${escapeHtml(name||'patient')} — duration logged for self-learning</div>
       </div>
     </div>`;
     toast({title:'Visit completed', message:`${dur} min logged.`, type:'booking'});
     setTimeout(()=>render(), 2200);
   } catch (e){
     btn.disabled = false; btn.textContent = 'End consultation';
     toast({title:'Could not end visit', message:e.message||'try again', urgent:true});
   }
 };
}

function openModal(html){

 root.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal" onclick="event.stopPropagation()">${html}</div></div>`;
 $('#modal-bg').onclick = closeModal;

}

 if (row){

});
