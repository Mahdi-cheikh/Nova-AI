<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="description" content="Nova AI — book appointments and manage your day.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Nova AI</title>
<style>
 :root {
 --bg:#0a0b10; --surface:#13151c; --surface-2:#1a1d27; --border:rgba(99,102,241,0.15);
 --text:#f3f4f6; --text-dim:#9ca3af; --text-faint:#6b7280;
 --accent:#6366f1; --accent-2:#8b5cf6; --accent-3:#22d3ee;
 --green:#22c55e; --yellow:#eab308; --red:#ef4444;
 --grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#22d3ee 100%);
 --safe-top:env(safe-area-inset-top,0); --safe-bot:env(safe-area-inset-bottom,0);
 }
 *,*::before,*::after { box-sizing:border-box; }
 html,body { margin:0;padding:0;background:var(--bg);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain; }
 body { min-height:100vh;min-height:100dvh;padding-bottom:calc(72px + var(--safe-bot)); }
 a { color:var(--accent);text-decoration:none; }
 button { font:inherit;cursor:pointer;border:0;background:transparent;color:inherit; }
 input,textarea,select { font:inherit;color:inherit;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;width:100%; }
 input:focus,textarea:focus,select:focus { outline:2px solid var(--accent);outline-offset:1px; }
 .wrap { max-width:480px;margin:0 auto;padding:calc(20px + var(--safe-top)) 16px 24px; }
 .topbar { display:flex;align-items:center;justify-content:space-between;margin-bottom:18px; }
 .logo { display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-0.3px; }
 .logo-mark { width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:white;font-weight:800;font-size:16px; }
 .bottom-nav { position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,22,0.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:8px 8px calc(8px + var(--safe-bot));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;z-index:50; }
 .nav-btn { display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:10px;color:var(--text-dim);font-size:11px;transition:color .15s; }
 .nav-btn .ic { font-size:22px;line-height:1; }
 .nav-btn.active { color:var(--accent); }
 .nav-btn:active { background:rgba(99,102,241,0.08); }
 .card { background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px; }
 .card h3 { margin:0 0 8px;font-size:16px;font-weight:600; }
 .sub { color:var(--text-dim);font-size:13px; }
 .btn { display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .08s,opacity .15s;gap:8px; }
 .btn:active { transform:scale(0.97); }
 .btn-primary { background:var(--grad);color:white;box-shadow:0 4px 16px rgba(99,102,241,0.35); }
 .btn-secondary { background:var(--surface-2);color:var(--text);border:1px solid var(--border); }
 .btn-block { width:100%; }
 .btn[disabled] { opacity:.55;pointer-events:none; }
 .pill { display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.2px; }
 .pill-blue { background:rgba(99,102,241,0.15);color:#a5b4fc; }
 .pill-green { background:rgba(34,197,94,0.15);color:#86efac; }
 .pill-yellow { background:rgba(234,179,8,0.15);color:#fde047; }
 .pill-red { background:rgba(239,68,68,0.15);color:#fca5a5; }
 .pill-gray { background:rgba(156,163,175,0.15);color:var(--text-dim); }
 .hero { background:var(--grad);border-radius:18px;padding:22px;color:white;margin-bottom:14px; }
 .hero h1 { margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.3px; }
 .hero .greet { font-size:13px;opacity:.9;text-transform:uppercase;letter-spacing:.5px; }
 .auth-wrap { min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px; }
 .auth-card { background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 24px;width:100%;max-width:400px;text-align:center; }
 .auth-card .logo-mark { width:56px;height:56px;font-size:26px;border-radius:14px;margin:0 auto 16px; }
 .apt-row { padding:12px;border-radius:12px;background:var(--surface-2);margin-bottom:8px;border-left:3px solid var(--accent); }
 .apt-when { font-weight:600;font-size:14px; }
 .apt-where { font-size:12.5px;color:var(--text-dim);margin-top:2px; }
 .empty { text-align:center;padding:40px 16px;color:var(--text-dim); }
 .empty .ic { font-size:48px;opacity:.4;margin-bottom:8px; }
 .toast { position:fixed;left:16px;right:16px;bottom:calc(80px + var(--safe-bot));background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,0.5);z-index:100;transform:translateY(140%);transition:transform .25s; }
 .toast.show { transform:translateY(0); }
 .section-h { display:flex;justify-content:space-between;align-items:center;margin:16px 4px 10px;font-size:13px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px; }
 .placeholder-page { padding:40px 16px;text-align:center; }
 .placeholder-page .ic { font-size:64px;margin-bottom:12px; }
 .role-card { padding:18px;border-radius:14px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:10px;cursor:pointer;display:flex;gap:14px;align-items:center;transition:transform .08s; }
 .role-card:active { transform:scale(0.98); }
 .role-card .ic { font-size:32px;flex-shrink:0; }
 .role-card .t { font-weight:600;font-size:15px; }
 .role-card .d { font-size:12.5px;color:var(--text-dim);margin-top:2px; }
 .otp-input { letter-spacing:8px;font-size:22px;font-weight:600;text-align:center; }
 @media (prefers-color-scheme:light) {
 :root { --bg:#f8fafc;--surface:#ffffff;--surface-2:#f1f5f9;--border:rgba(99,102,241,0.18);--text:#0f172a;--text-dim:#64748b;--text-faint:#94a3b8; }
 .bottom-nav { background:rgba(255,255,255,0.92); }

 /* ============================================================
    ANTI-GRAVITY PWA THEME — drifting orbs, rising particles,
    levitating cards, glow halos. Mobile-first phone optimised.
    ============================================================ */
 .pwa-bg { position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden; }
 .pwa-orb { position:absolute;border-radius:50%;filter:blur(70px);opacity:0.55;will-change:transform;mix-blend-mode:screen; }
 @media (prefers-color-scheme:light) { .pwa-orb { opacity:0.30;mix-blend-mode:multiply } }
 .pwa-orb-1 { width:340px;height:340px;background:radial-gradient(circle,#6366f1,transparent 70%);top:-12%;left:-15%;animation:pwa-drift-1 22s ease-in-out infinite; }
 .pwa-orb-2 { width:300px;height:300px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:35%;right:-18%;animation:pwa-drift-2 28s ease-in-out infinite; }
 .pwa-orb-3 { width:380px;height:380px;background:radial-gradient(circle,#22d3ee,transparent 70%);bottom:-15%;left:20%;animation:pwa-drift-3 32s ease-in-out infinite; }
 .pwa-orb-4 { width:240px;height:240px;background:radial-gradient(circle,#ec4899,transparent 70%);top:55%;left:5%;animation:pwa-drift-4 26s ease-in-out infinite; }
 @keyframes pwa-drift-1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(60px,80px) scale(1.12)} }
 @keyframes pwa-drift-2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-70px,-60px) scale(1.08)} }
 @keyframes pwa-drift-3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(50px,-90px) scale(1.15)} }
 @keyframes pwa-drift-4 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-40px,70px) scale(1.05)} }

 .pwa-particle { position:absolute;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.7),rgba(255,255,255,0));opacity:0.5;will-change:transform;pointer-events:none; }
 @media (prefers-color-scheme:light) { .pwa-particle{ background:radial-gradient(circle,rgba(99,102,241,0.6),transparent);opacity:0.4 } }
 @keyframes pwa-rise { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:1} 90%{opacity:1} 100%{transform:translateY(-110vh) translateX(30px);opacity:0} }

 /* All app content sits ABOVE the orb layer */
 .wrap, .auth-wrap, .bottom-nav, .toast { position:relative;z-index:1; }
 .bottom-nav { z-index:50; }

 /* Hero card gets a glow aura + levitate */
 .hero { position:relative;box-shadow:0 12px 40px -8px rgba(99,102,241,0.45),0 0 0 1px rgba(255,255,255,0.05) inset;animation:pwa-levitate 6s ease-in-out infinite; }
 .hero::before { content:'';position:absolute;inset:-12px;border-radius:24px;background:radial-gradient(closest-side,rgba(139,92,246,0.45),transparent 70%);filter:blur(18px);z-index:-1;animation:pwa-glow 4s ease-in-out infinite; }
 @keyframes pwa-levitate { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
 @keyframes pwa-glow { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.06)} }

 /* Cards levitate with staggered phases */
 .card, .role-card, .apt-row { animation:pwa-levitate-soft 7s ease-in-out infinite;will-change:transform; }
 .card:nth-child(odd), .apt-row:nth-child(odd) { animation-delay:-2s; }
 .card:nth-child(even), .apt-row:nth-child(even) { animation-delay:-4s; }
 @keyframes pwa-levitate-soft { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

 /* Logo mark also bobs */
 .logo-mark { animation:pwa-levitate 5s ease-in-out infinite;box-shadow:0 6px 18px rgba(99,102,241,0.4); }

 /* Primary CTA gets a slow-pulsing aura */
 .btn-primary { position:relative;overflow:visible;box-shadow:0 4px 18px rgba(99,102,241,0.4),0 0 0 0 rgba(99,102,241,0.45);animation:pwa-pulse 3.2s ease-in-out infinite; }
 @keyframes pwa-pulse {
   0%,100% { box-shadow:0 4px 18px rgba(99,102,241,0.4),0 0 0 0 rgba(99,102,241,0); transform:translateY(0); }
   50% { box-shadow:0 8px 30px rgba(99,102,241,0.55),0 0 0 14px rgba(99,102,241,0); transform:translateY(-2px); }
 }

 /* Section headers shimmer subtly */
 .section-h { background:linear-gradient(90deg,var(--text-dim),var(--accent),var(--text-dim));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:pwa-shimmer 5s linear infinite; }
 @keyframes pwa-shimmer { from{background-position:0% 50%} to{background-position:200% 50%} }

 /* Bottom nav: glassmorphism with floating active-indicator */
 .bottom-nav { box-shadow:0 -8px 30px rgba(99,102,241,0.18); }
 .nav-btn.active { position:relative; }
 .nav-btn.active::before { content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:0 0 6px 6px;background:var(--grad);box-shadow:0 0 12px var(--accent); }

 /* Make tappable elements bigger on phones */
 .btn { min-height:48px; }
 .nav-btn { min-height:54px; }
 .role-card { min-height:72px;padding:20px; }

 /* Auth card — glow + levitate */
 .auth-card { position:relative;box-shadow:0 16px 50px -10px rgba(99,102,241,0.4),0 0 0 1px rgba(255,255,255,0.04) inset;animation:pwa-levitate 6s ease-in-out infinite; }
 .auth-card::before { content:'';position:absolute;inset:-20px;border-radius:36px;background:radial-gradient(closest-side,rgba(99,102,241,0.35),transparent 70%);filter:blur(24px);z-index:-1;animation:pwa-glow 4s ease-in-out infinite; }

 /* Empty states get a friendly bounce */
 .empty .ic { animation:pwa-levitate 4s ease-in-out infinite; }

 /* Pills get a subtle pulse on the appointment row markers */
 .pill { transition:transform .2s; }
 .apt-row { border-left-width:4px;border-radius:14px;padding:14px; }

 /* Floating action button (FAB) — for primary action like "Book new" */
 .pwa-fab { position:fixed;right:18px;bottom:calc(86px + var(--safe-bot));width:56px;height:56px;border-radius:50%;background:var(--grad);box-shadow:0 12px 28px rgba(99,102,241,0.5);display:grid;place-items:center;color:white;font-size:24px;font-weight:300;z-index:40;border:0;animation:pwa-fab-bob 3.5s ease-in-out infinite; }
 @keyframes pwa-fab-bob { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-4px) scale(1.04)} }
 .pwa-fab:active { transform:scale(0.94); }

 /* Skeleton loader styling — subtle gradient sweep */
 .skel { background:linear-gradient(90deg,var(--surface-2) 25%,rgba(99,102,241,0.08) 50%,var(--surface-2) 75%);background-size:200% 100%;border-radius:10px;animation:pwa-skel 1.4s ease-in-out infinite; }
 @keyframes pwa-skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

 /* Reduced-motion respect */
 @media (prefers-reduced-motion:reduce) {
   .pwa-orb,.pwa-particle,.hero,.card,.role-card,.apt-row,.logo-mark,.btn-primary,
   .auth-card,.empty .ic,.section-h,.pwa-fab { animation:none !important }
 }

 /* QR scanner modal */
 .scan-overlay { position:fixed;inset:0;background:rgba(5,8,22,.92);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:24px 16px;gap:14px;animation:fade-in .2s ease; }
 @keyframes fade-in { from{opacity:0} to{opacity:1} }
 .scan-overlay h3 { color:#fff;margin:0;font-size:18px;font-weight:700;text-align:center; }
 .scan-overlay .sub { color:rgba(255,255,255,0.65);font-size:13px;text-align:center;margin:0 0 6px; }
 #qr-reader { width:100%;max-width:380px;border-radius:18px;overflow:hidden;border:2px solid var(--accent);box-shadow:0 0 30px rgba(99,102,241,0.4); }
 #qr-reader video { display:block;width:100%; }
 .scan-actions { display:flex;flex-direction:column;gap:10px;width:100%;max-width:380px; }
 .scan-msg { color:#fde047;font-size:13.5px;text-align:center;background:rgba(234,179,8,0.1);padding:10px 14px;border-radius:10px;border:1px solid rgba(234,179,8,0.25); }
 .scan-msg.err { color:#fca5a5;background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.25); }
 .scan-msg.ok  { color:#86efac;background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.25); }

 /* Consultation timer page */
 .ct-wrap { min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;text-align:center;gap:16px; }
 .ct-card { background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 22px;width:100%;max-width:420px;box-shadow:0 24px 60px -10px rgba(99,102,241,0.5);animation:pwa-levitate 6s ease-in-out infinite;position:relative; }
 .ct-card::before { content:'';position:absolute;inset:-16px;border-radius:36px;background:radial-gradient(closest-side,rgba(139,92,246,0.4),transparent 70%);filter:blur(22px);z-index:-1;animation:pwa-glow 4s ease-in-out infinite; }
 .ct-name { font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0 0 4px; }
 .ct-svc  { font-size:13.5px;color:var(--text-dim);margin:0 0 22px; }
 .ct-timer { font-size:64px;font-weight:200;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0; }
 .ct-sub { font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-weight:600; }
 .ct-meta { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0; }
 .ct-meta div { background:var(--surface-2);padding:10px;border-radius:10px;font-size:12px; }
 .ct-meta div b { display:block;font-size:14px;color:var(--text);margin-bottom:2px; }
 .ct-end { background:linear-gradient(135deg,#ef4444,#dc2626);color:white;width:100%;padding:18px;font-size:16px;font-weight:700;border-radius:14px;border:0;cursor:pointer;box-shadow:0 8px 24px rgba(239,68,68,0.4); }
 .ct-end:active { transform:scale(0.97); }
 .ct-end[disabled] { opacity:.6;pointer-events:none; }
 .ct-back { color:var(--text-dim);font-size:12.5px;text-decoration:none;margin-top:8px; }
 .ct-done { background:linear-gradient(135deg,#22c55e,#16a34a);color:white;padding:16px;border-radius:14px;font-weight:700;font-size:15px; }
 }
</style>
</head>
<body>
<!-- Anti-gravity background: drifting orbs + rising particles -->
<div class="pwa-bg" aria-hidden="true">
 <div class="pwa-orb pwa-orb-1"></div>
 <div class="pwa-orb pwa-orb-2"></div>
 <div class="pwa-orb pwa-orb-3"></div>
 <div class="pwa-orb pwa-orb-4"></div>
</div>
<div id="app">
 <div class="auth-wrap"><div class="auth-card">
 <div class="logo-mark" style="margin:0 auto 14px">N</div>
 <div style="font-size:14px;color:var(--text-dim)">Loading Nova…</div>
 <div style="margin:18px auto 0;width:32px;height:32px;border:3px solid rgba(99,102,241,0.2);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite"></div>
 <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
 </div></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

/* CONFIG — paste your Supabase anon key once */
const SUPABASE_URL = "https://blhvzuhufygdcnxpcwqx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_B07mS2iUZWuFEygDZIyhVg_KW86VgKh"; // <-- paste anon (public) key from Supabase → Settings → API
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY || "MISSING");

let SESSION = null, ROLES = [], ACTIVE_ROLE = null, PATIENT = null, DOCTOR = null, OWNER_BIZ = null;

const $ = (s) => document.querySelector(s);
const e = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const route = () => (location.hash || '#/').slice(1) || '/';
const navigate = (h) => { location.hash = h; };
const toast = (msg) => { const t = e(`<div class="toast">${escapeHtml(msg)}</div>`); document.body.appendChild(t); requestAnimationFrame(()=>t.classList.add('show')); setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 2800); };
const isoDate = (off=0) => { const d = new Date(); d.setDate(d.getDate()+off); return d.toISOString().slice(0,10); };
const friendlyDate = (s) => {
 if (!s) return '';
 if (s === isoDate(0)) return 'Today';
 if (s === isoDate(1)) return 'Tomorrow';
 if (s === isoDate(-1)) return 'Yesterday';
 return new Date(s+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
};

/* Detect every role this auth user has */
async function detectRoles() {
 ROLES = []; PATIENT = null; DOCTOR = null; OWNER_BIZ = null;
 if (!SESSION) return;
 const uid = SESSION.user.id;
 const [{data: pu}, {data: doc}, {data: biz}] = await Promise.all([
 sb.from('patient_users').select('*').eq('auth_uid', uid).maybeSingle(),
 sb.from('users').select('id, name, business_id, role, businesses(name, type)').eq('auth_uid', uid).eq('role','doctor').maybeSingle(),
 sb.from('businesses').select('id, name, type').eq('owner_user_id', uid).maybeSingle(),
 ]);
 if (pu) { PATIENT = pu; ROLES.push('patient'); }
 if (doc) { DOCTOR = doc; ROLES.push('doctor'); }
 if (biz) { OWNER_BIZ = biz; ROLES.push('owner'); }
 const stored = localStorage.getItem('nova_active_role');
 if (stored && ROLES.includes(stored)) ACTIVE_ROLE = stored;
 else if (ROLES.length === 1) ACTIVE_ROLE = ROLES[0];
 else ACTIVE_ROLE = null;
}

async function loadSession() {
 try {
 const { data } = await Promise.race([
 sb.auth.getSession(),
 new Promise((_, reject) => setTimeout(() => reject(new Error('session-timeout')), 3500)),
 ]);
 SESSION = data?.session || null;
 } catch (e) {
 console.warn('getSession timed out:', e);
 SESSION = null;
 }
 if (SESSION) {
 try {
 await Promise.race([
 detectRoles(),
 new Promise((_, reject) => setTimeout(() => reject(new Error('roles-timeout')), 4000)),
 ]);
 } catch (e) {
 console.warn('detectRoles timed out:', e);
 }
 }
}

/* Nuclear reset: removes every Supabase auth artifact from localStorage and
 forces a fresh sign-in. Doesn't wait on the network — survives broken sessions. */
function hardReset() {
 try { localStorage.removeItem('nova_active_role'); } catch (_e) {}
 try {
 for (const k of Object.keys(localStorage)) {
 if (k.startsWith('sb-') || k.includes('supabase')) localStorage.removeItem(k);
 }
 } catch (_e) {}
 try { sessionStorage.clear(); } catch (_e) {}
 // Best-effort signOut — fire and forget; don't await.
 sb.auth.signOut().catch(() => {});
 // Redirect to the marketing home page (with cache-buster) so the user lands
 // on the public landing instead of staying inside the PWA shell.
 location.replace('/?signedout=' + Date.now());
}
sb.auth.onAuthStateChange(async (event) => {
 await loadSession();
 if (typeof safeRender === 'function') safeRender(); else render();
});

// Auto-handle ?qr=<token> in URL — when doctor scans via OS camera, deep link
// lands here; if logged in as a doctor, jump straight into the consultation.
(function autoQr(){
  const params = new URLSearchParams(location.search);
  const tok = params.get('qr');
  if (!tok) return;
  // wait for first render to complete + role detection, then start
  const tryStart = async () => {
    if (!SESSION || !DOCTOR) return setTimeout(tryStart, 400);
    history.replaceState({}, '', location.pathname);  // clean ?qr from URL
    await startConsultation(tok);
  };
  setTimeout(tryStart, 600);
})();

/* ---------- QR SCANNER + CONSULTATION TIMER ---------- */
let CT_STATE = null; // { aptId, name, service, arrivedAt, tickHandle }

async function openScanner() {
  // Load html5-qrcode lazily
  if (!window.Html5Qrcode) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.10/html5-qrcode.min.js';
      s.onload = res; s.onerror = () => rej(new Error('Could not load scanner library'));
      document.head.appendChild(s);
    }).catch(e => { toast('Could not load scanner. Check your connection.'); throw e; });
  }
  const overlay = document.createElement('div');
  overlay.className = 'scan-overlay';
  overlay.innerHTML = `
    <h3>Scan patient QR</h3>
    <p class="sub">Hold your camera up to the patient's check-in code.</p>
    <div id="qr-reader"></div>
    <div id="qr-msg" class="scan-msg" style="display:none"></div>
    <div class="scan-actions">
      <button class="btn btn-secondary btn-block" id="qr-cancel">Cancel</button>
    </div>`;
  document.body.appendChild(overlay);
  const msg = (text, kind='') => {
    const el = overlay.querySelector('#qr-msg');
    el.className = 'scan-msg ' + kind;
    el.textContent = text;
    el.style.display = 'block';
  };
  const close = async () => {
    try { if (window.__qr) await window.__qr.stop(); } catch (_e) {}
    overlay.remove();
  };
  overlay.querySelector('#qr-cancel').onclick = close;

  const reader = new Html5Qrcode("qr-reader");
  window.__qr = reader;
  let scanning = true;
  try {
    await reader.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      async (decodedText) => {
        if (!scanning) return;
        scanning = false;
        // Extract token from URL or use raw text
        let token = decodedText;
        try {
          const u = new URL(decodedText);
          token = u.searchParams.get('qr') || u.searchParams.get('a') || decodedText;
        } catch (_e) { /* not a URL — use raw */ }
        msg('QR detected — starting visit...', 'ok');
        await close();
        startConsultation(token);
      },
      () => { /* per-frame errors are noisy; ignore */ }
    );
  } catch (e) {
    msg('Could not access camera: ' + (e.message || 'permission denied'), 'err');
  }
}

async function startConsultation(token) {
  try {
    const { data, error } = await sb.rpc('apt_start_consultation', {
      p_token: token,
      p_doctor_id: DOCTOR?.id || null,
    });
    if (error) throw error;
    if (!data || !data.length) throw new Error('Appointment not found');
    const a = data[0];
    CT_STATE = {
      aptId: a.appointment_id,
      name: a.client_name,
      service: a.service_name,
      arrivedAt: new Date(a.arrived_at).getTime(),
    };
    location.hash = '#/consultation';
  } catch (e) {
    toast(e.message || 'Could not start consultation');
  }
}

function renderConsultationTimer() {
  if (!CT_STATE) {
    return `<div class="ct-wrap"><div class="ct-card">
      <h3 style="margin:0 0 8px">No active visit</h3>
      <p class="sub" style="margin:0 0 18px">Scan a patient QR to start a consultation.</p>
      <button class="btn btn-primary btn-block" id="ct-scan-now">Scan QR</button>
      <a href="#/" class="ct-back">← Back home</a>
    </div></div>`;
  }
  return `<div class="ct-wrap"><div class="ct-card">
    <div class="ct-sub">Consultation in progress</div>
    <h2 class="ct-name">${escapeHtml(CT_STATE.name || '—')}</h2>
    <div class="ct-svc">${escapeHtml(CT_STATE.service || '')}</div>
    <div class="ct-timer" id="ct-timer">00:00</div>
    <div class="ct-sub">elapsed</div>
    <div class="ct-meta">
      <div><span class="sub" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim)">Started</span><b id="ct-started">—</b></div>
      <div><span class="sub" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-dim)">Doctor</span><b>${escapeHtml(DOCTOR?.name || 'You')}</b></div>
    </div>
    <button class="ct-end" id="ct-end-btn">End consultation</button>
    <div style="margin-top:12px"><a href="#/" class="ct-back">← Hide (visit keeps timing)</a></div>
  </div></div>`;
}

function bindConsultationTimer() {
  const scanNow = $('#ct-scan-now');
  if (scanNow) { scanNow.onclick = openScanner; return; }
  if (!CT_STATE) return;
  // Start the live tick
  const timerEl = $('#ct-timer');
  const startedEl = $('#ct-started');
  const start = CT_STATE.arrivedAt;
  startedEl.textContent = new Date(start).toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
  const tick = () => {
    if (!timerEl || !CT_STATE) return;
    const ms = Date.now() - start;
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };
  tick();
  if (CT_STATE.tickHandle) clearInterval(CT_STATE.tickHandle);
  CT_STATE.tickHandle = setInterval(tick, 1000);

  $('#ct-end-btn').onclick = async () => {
    const btn = $('#ct-end-btn');
    btn.disabled = true; btn.textContent = 'Ending...';
    try {
      const { data, error } = await sb.rpc('apt_end_consultation', { p_appointment_id: CT_STATE.aptId });
      if (error) throw error;
      const dur = (data && data[0]?.actual_duration_min) || Math.floor((Date.now() - start) / 60000);
      clearInterval(CT_STATE.tickHandle);
      const card = btn.closest('.ct-card');
      card.innerHTML = `<div class="ct-sub" style="color:#86efac">Visit completed</div>
        <h2 class="ct-name" style="margin:6px 0 14px">${dur} min</h2>
        <p class="sub" style="margin:0 0 18px">Logged for ${escapeHtml(CT_STATE.name || 'patient')}. Schedule learning will use this to refine future bookings.</p>
        <button class="btn btn-primary btn-block" onclick="location.hash='#/'">Back to today</button>`;
      CT_STATE = null;
    } catch (e) {
      btn.disabled = false; btn.textContent = 'End consultation';
      toast(e.message || 'Could not end consultation');
    }
  };
}

 <div class="apt-when">${escapeHtml(c.name||'—')} ${c.age?`<span class="pill pill-gray" style="margin-left:6px">${c.age}y</span>`:''}</div>
 <div class="apt-where">${escapeHtml(c.phone||'')}${c.last_visit_at?` · last visit ${friendlyDate(String(c.last_visit_at).slice(0,10))}`:''}</div>
 </div>`;
 return `<div class="wrap"><div class="topbar"><div class="logo"><div class="logo-mark">N</div> Patients</div></div>
 <div class="section-h"><span>${list.length} patient${list.length===1?'':'s'}</span></div>
 ${list.length===0?`<div class="card empty"><div class="ic"></div>No patients yet.</div>`:list.map(row).join('')}
 </div>${renderNav('patients')}`;
}
function renderDoctorNotes() {
 return `<div class="wrap"><div class="topbar"><div class="logo"><div class="logo-mark">N</div> Notes</div></div>
 <div class="card placeholder-page"><div class="ic">▤</div>
 <h3 style="margin:0 0 6px">Voice-to-text notes</h3>
 <p class="sub">Record during a consultation; Nova writes the SOAP note. Coming soon.</p>
 </div>
 </div>${renderNav('notes')}`;
}

/* ---------- OWNER VIEW ---------- */
function renderOwnerHome() {
 const bizName = OWNER_BIZ?.name || 'your business';
 const bizType = OWNER_BIZ?.type || '';
 return `<div class="wrap">
 <div class="topbar">
 <div class="logo"><div class="logo-mark">N</div> Nova</div>
 <button class="nav-btn" id="signout-btn" style="font-size:11px"><span class="ic">⎋</span><span>Sign out</span></button>
 </div>
 <div class="hero">
 <div class="greet">Owner mode</div>
 <h1>${escapeHtml(bizName)} ${bizType?`<span style="font-size:13px;opacity:.7;font-weight:400">· ${escapeHtml(bizType)}</span>`:''}</h1>
 <div style="font-size:13px;opacity:.85;margin-top:6px">The full dashboard with calendar, appointments, lab pipeline, team, settings is on the desktop UI.</div>
 </div>

 <div class="card">
 <h3>Open the dashboard</h3>
 <p class="sub" style="margin:0 0 14px">Best on a tablet or computer — full feature set.</p>
 <a href="/?from=pwa&forceWeb=1#/dashboard" class="btn btn-primary btn-block" style="text-decoration:none">Open full dashboard →</a>
 </div>

 ${ROLES.length > 1 ? `<div class="card">
 <h3>Switch role</h3>
 <p class="sub" style="margin:0 0 12px">You also have ${ROLES.filter(r=>r!=='owner').join(' and ')} access on Nova.</p>
 <button class="btn btn-secondary btn-block" id="switch-role">Pick a different role</button>
 </div>` : `<div class="card">
 <h3>Use Nova as a patient</h3>
 <p class="sub" style="margin:0 0 12px">Want to track your own bookings across other businesses on Nova?</p>
 <button class="btn btn-secondary btn-block" id="become-patient">Set up as patient</button>
 </div>`}

 <div class="card" style="text-align:center">
 <p class="sub" style="margin:0;font-size:11.5px">Designed and built by <b>Mehdi Cheikh</b></p>
 </div>
 </div>`;
}
function bindOwnerHome() {
 $('#signout-btn').onclick = () => hardReset();
 const sw = $('#switch-role'); if (sw) sw.onclick = () => { localStorage.removeItem('nova_active_role'); ACTIVE_ROLE = null; safeRender(); };
 const bp = $('#become-patient'); if (bp) bp.onclick = async () => {
 const { data, error } = await sb.rpc('pwa_ensure_patient_user', { p_full_name: SESSION.user.user_metadata?.full_name || null });
 if (error) { toast('Could not start patient setup: ' + error.message); return; }
 PATIENT = data;
 if (!ROLES.includes('patient')) ROLES.push('patient');
 localStorage.setItem('nova_active_role', 'patient');
 ACTIVE_ROLE = 'patient';
 safeRender();
 };
}

/* ---------- ROUTER ---------- */
async function render() {
 await loadSession();

 if (!SUPABASE_ANON_KEY) {
 $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card"><div class="logo-mark">N</div>
 <h2 style="margin:0 0 8px">Setup needed</h2>
 <p class="sub">Edit pwa/index.html and paste your Supabase anon key in SUPABASE_ANON_KEY.</p></div></div>`;
 return;
 }
 if (!SESSION) { $('#app').innerHTML = renderAuth(); bindAuth(); return; }

 // Newly-arrived user with no role yet → role picker
 if (ROLES.length === 0) { $('#app').innerHTML = renderRolePicker(); bindRolePicker(); return; }

 // Multi-role with no choice persisted → ask once
 if (!ACTIVE_ROLE && ROLES.length > 1) { $('#app').innerHTML = renderRolePicker(); bindRolePicker(); return; }

 // Owner role: render an "Owner mode" landing page inside the PWA (no auto-redirect).
 if (ACTIVE_ROLE === 'owner') { $('#app').innerHTML = renderOwnerHome(); bindOwnerHome(); return; }

 // Patient role: phone-OTP onboarding gate
 if (ACTIVE_ROLE === 'patient') {
 if (!PATIENT?.phone_verified) { $('#app').innerHTML = renderPhoneOnboarding('phone'); bindPhoneStep(); return; }
 const r = route();
 if (r === '/profile') { $('#app').innerHTML = await renderProfile(); bindProfile(); return; }
 if (r === '/discover') { $('#app').innerHTML = renderDiscover(); bindNav(); return; }
 if (r === '/files') { $('#app').innerHTML = renderFiles(); bindNav(); return; }
 $('#app').innerHTML = await renderPatientHome(); bindPatientHome();
 return;
 }

 // Doctor role
 if (ACTIVE_ROLE === 'doctor') {
 const r = route();
 if (r === '/consultation') { $('#app').innerHTML = renderConsultationTimer(); bindConsultationTimer(); return; }
 if (r === '/patients') { $('#app').innerHTML = await renderDoctorPatients(); bindNav(); return; }
 if (r === '/notes') { $('#app').innerHTML = renderDoctorNotes(); bindNav(); return; }
 if (r === '/profile') { $('#app').innerHTML = await renderProfile(); bindProfile(); return; }
 $('#app').innerHTML = await renderDoctorMyDay(); bindDoctorMyDay();
 return;
 }
}
/* Resilient render: catches any error so the user never sees a blank screen */
let RENDERING = false;
async function safeRender() {
 if (RENDERING) return;
 RENDERING = true;
 try {
 // 6-second hard timeout on auth/role detection — if Supabase is slow we
 // still surface SOMETHING rather than a forever-loading spinner.
 await Promise.race([
 render(),
 new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 6000)),
 ]);
 } catch (err) {
 console.error('Render failed:', err);
 $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card">
 <div class="logo-mark" style="margin:0 auto 14px">N</div>
 <h2 style="margin:0 0 8px;font-size:18px">Something went wrong</h2>
 <p class="sub" style="margin:0 0 16px">${escapeHtml(String(err?.message || err))}</p>
 <button class="btn btn-primary btn-block" id="err-reload">Reload</button>
 <button class="btn btn-secondary btn-block" style="margin-top:8px" id="err-reset">Sign out &amp; reset</button>
 </div></div>`;
 const r = $('#err-reload'); if (r) r.onclick = () => location.reload();
 const so = $('#err-reset'); if (so) so.onclick = () => hardReset();
 } finally {
 RENDERING = false;
 }
}

window.addEventListener('hashchange', safeRender);
/* Re-render when the tab becomes visible again (returning from another app, etc.) */
document.addEventListener('visibilitychange', () => {
 if (document.visibilityState === 'visible') safeRender();
});
/* And on focus, in case visibilitychange doesn't fire on some browsers */
window.addEventListener('focus', safeRender);
/* Also re-render when we come back online after the network had dropped */
window.addEventListener('online', safeRender);

/* ANTI-GRAVITY: spawn 14 small particles that float upward through the PWA */
(function spawnParticles(){
  const bg = document.querySelector('.pwa-bg');
  if (!bg) return;
  for (let i = 0; i < 14; i++) {
    const p = document.createElement('span');
    p.className = 'pwa-particle';
    const delay = -Math.random() * 16;
    const dur = 12 + Math.random() * 10;
    const left = Math.random() * 100;
    const size = 2 + Math.random() * 4;
    p.style.cssText = `left:${left}vw;bottom:-10vh;width:${size}px;height:${size}px;animation:pwa-rise ${dur}s linear ${delay}s infinite`;
    bg.appendChild(p);
  }
})();

safeRender();

/* Service worker */
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* Install banner (Android) */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', (ev) => {
 ev.preventDefault(); deferredInstall = ev;
 // If the user came from the landing page's "Install" button (?install=1),
 // fire the native prompt immediately instead of waiting 5 seconds.
 if (new URLSearchParams(location.search).get('install') === '1') {
 setTimeout(() => {
 if (deferredInstall) {
 deferredInstall.prompt();
 deferredInstall.userChoice.then((c) => { if (c.outcome === 'accepted') toast('Nova installed'); deferredInstall = null; });
 }
 }, 200);
 return;
 }
 setTimeout(() => {
 if (!deferredInstall || sessionStorage.getItem('pwa_install_dismissed')) return;
 const banner = e(`<div class="toast show" style="background:var(--grad);color:white;border:0;display:flex;justify-content:space-between;gap:10px;align-items:center">
 <span style="font-size:13px">Add Nova to your home screen</span>
 <span><button id="pwa-install" style="background:rgba(255,255,255,0.18);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600">Install</button>
 <button id="pwa-dismiss" style="opacity:.7;margin-left:6px">×</button></span></div>`);
 document.body.appendChild(banner);
 banner.querySelector('#pwa-install').onclick = async () => {
 banner.remove(); deferredInstall.prompt();
 const choice = await deferredInstall.userChoice;
 deferredInstall = null;
 if (choice.outcome === 'accepted') toast('Nova installed');
 };
 banner.querySelector('#pwa-dismiss').onclick = () => { sessionStorage.setItem('pwa_install_dismissed','1'); banner.remove(); };
 }, 5000);
});
</script>
</body>
