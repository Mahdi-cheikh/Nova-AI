<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<meta name="description" content="Your 24/7 multilingual receptionist — book any appointment in Tunisia.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Nova AI</title>

<style>
  :root {
    --bg: #0a0b10;
    --surface: #13151c;
    --surface-2: #1a1d27;
    --border: rgba(99,102,241,0.15);
    --text: #f3f4f6;
    --text-dim: #9ca3af;
    --text-faint: #6b7280;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --accent-3: #22d3ee;
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --grad: linear-gradient(135deg,#6366f1 0%,#8b5cf6 50%,#22d3ee 100%);
    --safe-top: env(safe-area-inset-top, 0);
    --safe-bot: env(safe-area-inset-bottom, 0);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
               -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
  body { min-height: 100vh; min-height: 100dvh; padding-bottom: calc(72px + var(--safe-bot)); }
  a { color: var(--accent); text-decoration: none; }
  button { font: inherit; cursor: pointer; border: 0; background: transparent; color: inherit; }
  input, textarea, select {
    font: inherit; color: inherit;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Layout */
  .wrap { max-width: 480px; margin: 0 auto; padding: calc(20px + var(--safe-top)) 16px 24px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.3px; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--grad);
               display: grid; place-items: center; color: white; font-weight: 800; font-size: 16px; }

  /* Bottom nav */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0;
                background: rgba(13,15,22,0.92); backdrop-filter: blur(14px);
                border-top: 1px solid var(--border);
                padding: 8px 8px calc(8px + var(--safe-bot));
                display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; z-index: 50; }
  .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 3px;
             padding: 6px 4px; border-radius: 10px; color: var(--text-dim); font-size: 11px;
             transition: color .15s; }
  .nav-btn .ic { font-size: 22px; line-height: 1; }
  .nav-btn.active { color: var(--accent); }
  .nav-btn:active { background: rgba(99,102,241,0.08); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card-grad { background: var(--grad); color: white; border: 0; }
  .card h3 { margin: 0 0 8px; font-size: 16px; font-weight: 600; }
  .sub { color: var(--text-dim); font-size: 13px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; justify-content: center;
         padding: 13px 20px; border-radius: 12px; font-weight: 600; font-size: 15px;
         transition: transform .08s, opacity .15s; gap: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--grad); color: white; box-shadow: 0 4px 16px rgba(99,102,241,0.35); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: .55; pointer-events: none; }

  /* Pills */
  .pill { display: inline-block; padding: 3px 9px; border-radius: 999px;
          font-size: 11px; font-weight: 600; letter-spacing: 0.2px; }
  .pill-blue { background: rgba(99,102,241,0.15); color: #a5b4fc; }
  .pill-green { background: rgba(34,197,94,0.15); color: #86efac; }
  .pill-yellow { background: rgba(234,179,8,0.15); color: #fde047; }
  .pill-red { background: rgba(239,68,68,0.15); color: #fca5a5; }
  .pill-gray { background: rgba(156,163,175,0.15); color: var(--text-dim); }

  /* Hero (home greeting) */
  .hero { background: var(--grad); border-radius: 18px; padding: 22px; color: white; margin-bottom: 14px; }
  .hero h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .hero .greet { font-size: 13px; opacity: .9; text-transform: uppercase; letter-spacing: .5px; }

  /* Auth */
  .auth-wrap { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .auth-card { background: var(--surface); border: 1px solid var(--border);
               border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 400px; text-align: center; }
  .auth-card .logo-mark { width: 56px; height: 56px; font-size: 26px; border-radius: 14px; margin: 0 auto 16px; }

  /* Appointment list rows */
  .apt-row { padding: 12px; border-radius: 12px; background: var(--surface-2);
             margin-bottom: 8px; border-left: 3px solid var(--accent); }
  .apt-when { font-weight: 600; font-size: 14px; }
  .apt-where { font-size: 12.5px; color: var(--text-dim); margin-top: 2px; }

  /* Empty state */
  .empty { text-align: center; padding: 40px 16px; color: var(--text-dim); }
  .empty .ic { font-size: 48px; opacity: 0.4; margin-bottom: 8px; }

  /* Skeleton */
  .skel { background: linear-gradient(90deg, var(--surface-2) 0%, var(--surface) 50%, var(--surface-2) 100%);
          background-size: 200% 100%; animation: shimmer 1.4s infinite;
          border-radius: 8px; height: 14px; margin: 6px 0; }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  /* Toast */
  .toast { position: fixed; left: 16px; right: 16px; bottom: calc(80px + var(--safe-bot));
           background: var(--surface); border: 1px solid var(--border);
           border-radius: 12px; padding: 12px 14px; font-size: 13.5px;
           box-shadow: 0 6px 24px rgba(0,0,0,0.5); z-index: 100;
           transform: translateY(140%); transition: transform .25s; }
  .toast.show { transform: translateY(0); }

  /* Section header */
  .section-h { display: flex; justify-content: space-between; align-items: center;
               margin: 16px 4px 10px; font-size: 13px; font-weight: 600;
               color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }

  /* Coming-soon placeholders */
  .placeholder-page { padding: 40px 16px; text-align: center; }
  .placeholder-page .ic { font-size: 64px; margin-bottom: 12px; }

  /* Light mode */
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9;
      --border: rgba(99,102,241,0.18);
      --text: #0f172a; --text-dim: #64748b; --text-faint: #94a3b8;
    }
    .bottom-nav { background: rgba(255,255,255,0.92); }
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

/* ---------- CONFIG ---------- */
/* Reuse the same Supabase project as the main dashboard. The values below
   are baked in for production use; if you want users to provide their own,
   wrap with the same CFG_KEY pattern as the dashboard. */
const SUPABASE_URL = "https://blhvzuhufygdcnxpcwqx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_B07mS2iUZWuFEygDZIyhVg_KW86VgKh"; // <-- paste your anon key here
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY || "MISSING_ANON_KEY");

/* ---------- STATE ---------- */
let SESSION = null;
let PATIENT = null;

/* ---------- HELPERS ---------- */
const $ = (s) => document.querySelector(s);
const e = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const route = () => (location.hash || '#/').slice(1) || '/';
const navigate = (h) => { location.hash = h; };
const toast = (msg, kind='info') => {
  const t = e(`<div class="toast ${kind}">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t); requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 2800);
};
const isoDate = (offset=0) => { const d = new Date(); d.setDate(d.getDate()+offset); return d.toISOString().slice(0,10); };
const friendlyDate = (s) => {
  if (!s) return '';
  if (s === isoDate(0))  return 'Today';
  if (s === isoDate(1))  return 'Tomorrow';
  return new Date(s + 'T00:00:00').toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
};

/* ---------- AUTH ---------- */
async function loadSession(){
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
  if (session) {
    const { data: pu } = await sb.from('patient_users').select('*').eq('auth_uid', session.user.id).maybeSingle();
    PATIENT = pu;
  } else PATIENT = null;
}
sb.auth.onAuthStateChange(async () => { await loadSession(); render(); });

/* ---------- VIEWS ---------- */
function renderAuth() {
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo-mark">N</div>
      <h2 style="margin:0 0 6px;font-size:22px;font-weight:700">Welcome to Nova</h2>
      <p class="sub" style="margin:0 0 20px">Your 24/7 receptionist for clinics, labs, salons and more.</p>
      <form id="auth-form">
        <div style="margin-bottom:12px;text-align:left">
          <label style="display:block;margin-bottom:6px;font-size:13px;color:var(--text-dim)">Email</label>
          <input id="auth-email" type="email" required placeholder="you@example.com" autocomplete="email" />
        </div>
        <button class="btn btn-primary btn-block" id="auth-submit" type="submit">
          <span id="auth-label">Send me a magic link</span>
        </button>
      </form>
      <div id="auth-status" style="display:none;margin-top:14px;padding:12px;border-radius:10px;font-size:13px"></div>
      <p class="sub" style="margin:18px 0 0;font-size:12px">No password needed — we'll email you a one-time link.</p>
    </div>
  </div>`;
}

function bindAuth(){
  $('#auth-form').onsubmit = async (ev) => {
    ev.preventDefault();
    const email = $('#auth-email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast('Please enter a valid email'); return; }
    const submit = $('#auth-submit');
    submit.disabled = true;
    $('#auth-label').textContent = 'Sending…';
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: location.origin + location.pathname }
    });
    submit.disabled = false;
    const status = $('#auth-status');
    if (error) {
      status.style.display = 'block';
      status.style.background = 'rgba(239,68,68,0.12)';
      status.style.color = '#fca5a5';
      status.textContent = error.message;
      $('#auth-label').textContent = 'Try again';
    } else {
      status.style.display = 'block';
      status.style.background = 'rgba(34,197,94,0.12)';
      status.style.color = '#86efac';
      status.textContent = `📩 Check ${email} — your sign-in link should arrive in seconds.`;
      $('#auth-label').textContent = '✓ Sent';
    }
  };
}

/* Bottom navigation */
function renderNav(active) {
  const item = (key, label, icon) => {
    const isActive = active === key;
    return `<button class="nav-btn ${isActive?'active':''}" data-go="/${key === 'home' ? '' : key}">
      <span class="ic">${icon}</span><span>${label}</span>
    </button>`;
  };
  return `<nav class="bottom-nav">
    ${item('home','Home','⌂')}
    ${item('discover','Discover','◎')}
    ${item('documents','Files','▤')}
    ${item('profile','Me','◉')}
  </nav>`;
}

function bindNav() {
  document.querySelectorAll('.nav-btn[data-go]').forEach(b => b.onclick = () => navigate('#' + b.getAttribute('data-go')));
}

/* HOME — greeting + upcoming appointments */
async function renderHome() {
  const greet = (() => {
    const h = new Date().getHours();
    if (h < 12) return 'Good morning';
    if (h < 18) return 'Good afternoon';
    return 'Good evening';
  })();
  const name = (PATIENT?.full_name || SESSION?.user?.email || '').split(/[\s@]/)[0];

  // Upcoming appointments — RLS lets the patient see all their rows across businesses
  const today = isoDate(0);
  const { data: apts = [] } = await sb.from('appointments')
    .select(`id, date, time, status, total_amount,
             services(name),
             businesses(name, type, phone),
             clients(patient_user_id)`)
    .gte('date', today)
    .neq('status', 'cancelled')
    .order('date').order('time')
    .limit(8);
  const mine = (apts || []).filter(a => a.clients?.patient_user_id === PATIENT?.id);

  const aptCard = (a) => `
    <div class="apt-row">
      <div class="apt-when">${friendlyDate(a.date)} · ${(a.time||'').slice(0,5)}</div>
      <div class="apt-where">${escapeHtml(a.businesses?.name || '')}${a.services?.name ? ` · ${escapeHtml(a.services.name)}` : ''}</div>
      <div style="margin-top:6px">
        <span class="pill pill-${a.status==='confirmed'?'green':'gray'}">${a.status}</span>
        ${a.businesses?.phone ? `<a href="https://wa.me/${a.businesses.phone.replace(/\\D/g,'')}" class="pill pill-blue" style="margin-left:6px;text-decoration:none">📞 WhatsApp</a>` : ''}
      </div>
    </div>`;

  const body = `
    <div class="wrap">
      <div class="topbar">
        <div class="logo"><div class="logo-mark">N</div> Nova</div>
        <button class="nav-btn" id="signout-btn" style="font-size:11px"><span class="ic">⎋</span><span>Sign out</span></button>
      </div>

      <div class="hero">
        <div class="greet">${greet}</div>
        <h1>${name ? escapeHtml(name) : 'Welcome'} 👋</h1>
        <div style="font-size:13px;opacity:.85;margin-top:4px">
          ${mine.length === 0 ? "You have no upcoming appointments." : `You have ${mine.length} upcoming appointment${mine.length===1?'':'s'}.`}
        </div>
      </div>

      <div class="section-h"><span>Upcoming</span>${mine.length ? `<a href="#/appointments">See all</a>` : ''}</div>
      ${mine.length === 0
        ? `<div class="card"><div class="empty"><div class="ic">📅</div>Nothing scheduled yet.<br><a href="#/discover">Find a business →</a></div></div>`
        : mine.slice(0,3).map(aptCard).join('')}

      <div class="section-h"><span>Quick actions</span></div>
      <div class="card" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <a href="#/discover" class="btn btn-secondary" style="text-decoration:none">◎ Find</a>
        <a href="#/documents" class="btn btn-secondary" style="text-decoration:none">▤ Files</a>
      </div>
    </div>
    ${renderNav('home')}`;
  return body;
}

function bindHome() {
  $('#signout-btn').onclick = async () => { await sb.auth.signOut(); navigate('#/'); };
  bindNav();
}

/* APPOINTMENTS list */
async function renderAppointments() {
  const { data: apts = [] } = await sb.from('appointments')
    .select(`id, date, time, status, total_amount,
             services(name), businesses(name, phone, type),
             clients(patient_user_id)`)
    .order('date',{ascending:false}).order('time',{ascending:false})
    .limit(50);
  const mine = (apts || []).filter(a => a.clients?.patient_user_id === PATIENT?.id);
  const today = isoDate(0);
  const upcoming = mine.filter(a => a.date >= today && a.status !== 'cancelled');
  const past     = mine.filter(a => a.date <  today || a.status === 'cancelled' || a.status === 'completed');

  const aptCard = (a) => `
    <div class="apt-row">
      <div class="apt-when">${friendlyDate(a.date)} · ${(a.time||'').slice(0,5)}</div>
      <div class="apt-where">${escapeHtml(a.businesses?.name || '')}${a.services?.name ? ` · ${escapeHtml(a.services.name)}` : ''}</div>
      <div style="margin-top:6px">
        <span class="pill pill-${a.status==='confirmed'?'green':a.status==='completed'?'blue':'gray'}">${a.status}</span>
        ${a.total_amount ? `<span class="pill pill-gray" style="margin-left:6px">${a.total_amount} TND</span>` : ''}
      </div>
    </div>`;

  return `
    <div class="wrap">
      <div class="topbar"><div class="logo"><div class="logo-mark">N</div> Appointments</div></div>
      <div class="section-h"><span>Upcoming (${upcoming.length})</span></div>
      ${upcoming.length === 0 ? `<div class="card empty"><div class="ic">📅</div>Nothing upcoming.</div>` : upcoming.map(aptCard).join('')}
      <div class="section-h"><span>Past (${past.length})</span></div>
      ${past.length === 0 ? `<div class="card empty"><div class="ic">⌀</div>No history yet.</div>` : past.map(aptCard).join('')}
    </div>
    ${renderNav('home')}`;
}

/* DISCOVER — placeholder for iteration 2 */
function renderDiscover() {
  return `
    <div class="wrap">
      <div class="topbar"><div class="logo"><div class="logo-mark">N</div> Discover</div></div>
      <div class="card placeholder-page">
        <div class="ic">◎</div>
        <h3 style="margin:0 0 6px">Find a business near you</h3>
        <p class="sub" style="margin:0 0 16px">Search clinics, labs, salons, garages, lawyers, photographers — every Nova-powered business in Tunisia.</p>
        <input type="search" placeholder="Try: cardiologist La Marsa, hair salon Tunis…" style="margin-bottom:10px" />
        <button class="btn btn-primary btn-block">Search</button>
        <p class="sub" style="margin-top:14px;font-size:12px">Coming next: map view, filters, ratings, and live availability.</p>
      </div>
    </div>
    ${renderNav('discover')}`;
}

/* DOCUMENTS — placeholder for iteration 4 */
function renderDocuments() {
  return `
    <div class="wrap">
      <div class="topbar"><div class="logo"><div class="logo-mark">N</div> My files</div></div>
      <div class="card placeholder-page">
        <div class="ic">▤</div>
        <h3 style="margin:0 0 6px">Your health & business documents</h3>
        <p class="sub" style="margin:0">Lab results, prescriptions, vehicle records, contracts — all in one place. Coming in the next iteration.</p>
      </div>
    </div>
    ${renderNav('documents')}`;
}

/* PROFILE */
async function renderProfile() {
  const { data: family = [] } = await sb.from('patient_family')
    .select('*').eq('patient_user_id', PATIENT?.id || '00000000-0000-0000-0000-000000000000').order('created_at');

  const fam = (m) => `
    <div class="apt-row">
      <div class="apt-when">${escapeHtml(m.full_name)}</div>
      <div class="apt-where">${escapeHtml(m.relationship || '')}${m.birth_year ? ` · ${m.birth_year}` : ''}</div>
    </div>`;

  return `
    <div class="wrap">
      <div class="topbar"><div class="logo"><div class="logo-mark">N</div> Profile</div></div>

      <div class="card">
        <h3>${escapeHtml(PATIENT?.full_name || SESSION?.user?.email || 'My account')}</h3>
        <div class="sub">${escapeHtml(SESSION?.user?.email || '')}${PATIENT?.phone ? ` · ${escapeHtml(PATIENT.phone)}` : ''}</div>
        <button class="btn btn-secondary btn-block" id="profile-edit" style="margin-top:14px">Edit profile</button>
      </div>

      <div class="section-h"><span>Family members</span><a href="#" id="add-family">+ Add</a></div>
      ${family.length === 0
        ? `<div class="card empty"><div class="ic">👥</div>Add family members so you can book appointments for them.</div>`
        : family.map(fam).join('')}

      <div class="card" style="margin-top:14px">
        <h3>Notifications</h3>
        <p class="sub" style="margin:6px 0 12px">Get a push notification when results arrive or appointments are confirmed.</p>
        <button class="btn btn-secondary btn-block" id="enable-push">🔔 Enable push notifications</button>
      </div>

      <div class="card" style="margin-top:14px;text-align:center">
        <button class="btn btn-secondary" id="signout">Sign out</button>
        <p class="sub" style="margin:14px 0 0;font-size:11.5px">Designed and built by <b>Mehdi Cheikh</b></p>
      </div>
    </div>
    ${renderNav('profile')}`;
}

function bindProfile() {
  $('#signout').onclick = async () => { await sb.auth.signOut(); navigate('#/'); };
  $('#profile-edit').onclick = () => editProfileFlow();
  $('#add-family').onclick = (ev) => { ev.preventDefault(); addFamilyFlow(); };
  $('#enable-push').onclick = () => enablePush();
  bindNav();
}

async function editProfileFlow() {
  const fullName = prompt('Your full name:', PATIENT?.full_name || '');
  if (fullName === null) return;
  const phone = prompt('Phone number (international format, e.g. +21629774784):', PATIENT?.phone || '');
  if (phone === null) return;
  const language = prompt('Preferred language (en / fr / ar):', PATIENT?.language || 'en');
  if (language === null) return;
  const { error } = await sb.from('patient_users')
    .update({ full_name: fullName, phone: phone || null, language: language || 'en' })
    .eq('id', PATIENT.id);
  if (error) toast('Save failed: ' + error.message);
  else { toast('Profile updated'); await loadSession(); render(); }
}

async function addFamilyFlow() {
  const name = prompt('Family member full name:');
  if (!name) return;
  const rel = prompt('Relationship (child / spouse / parent / other):', 'child') || 'other';
  const year = prompt('Birth year (optional):');
  const { error } = await sb.from('patient_family').insert({
    patient_user_id: PATIENT.id, full_name: name, relationship: rel,
    birth_year: year ? parseInt(year, 10) : null,
  });
  if (error) toast('Add failed: ' + error.message);
  else { toast('Family member added'); render(); }
}

async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    toast('Push not supported on this browser'); return;
  }
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('Permission denied'); return; }
    toast('Push enabled — we will let you know when there is news');
    // Subscribing to a real push endpoint requires a VAPID key + an Edge Function
    // to deliver. We will wire that in iteration 4 alongside Documents.
  } catch (e) {
    toast('Could not enable: ' + e.message);
  }
}

/* ---------- ROUTER ---------- */
async function render() {
  await loadSession();
  if (!SUPABASE_ANON_KEY) {
    $('#app').innerHTML = `<div class="auth-wrap"><div class="auth-card">
      <div class="logo-mark">N</div>
      <h2 style="margin:0 0 8px">Setup needed</h2>
      <p class="sub">Edit pwa/index.html and paste your Supabase anon key in the SUPABASE_ANON_KEY constant.</p>
    </div></div>`;
    return;
  }
  if (!SESSION) {
    $('#app').innerHTML = renderAuth();
    bindAuth();
    return;
  }
  const r = route();
  if (r === '/' || r === '/home') { $('#app').innerHTML = await renderHome(); bindHome(); return; }
  if (r === '/appointments')      { $('#app').innerHTML = await renderAppointments(); bindNav(); return; }
  if (r === '/discover')          { $('#app').innerHTML = renderDiscover(); bindNav(); return; }
  if (r === '/documents')         { $('#app').innerHTML = renderDocuments(); bindNav(); return; }
  if (r === '/profile')           { $('#app').innerHTML = await renderProfile(); bindProfile(); return; }
  $('#app').innerHTML = await renderHome(); bindHome();
}
window.addEventListener('hashchange', render);
render();

/* ---------- SERVICE WORKER ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW failed', e));
  });
}

/* ---------- INSTALL PROMPT (Android Chrome) ---------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (ev) => {
  ev.preventDefault();
  deferredInstallPrompt = ev;
  // After 5 seconds, surface a subtle install banner unless the user is mid-task
  setTimeout(() => {
    if (!deferredInstallPrompt || sessionStorage.getItem('pwa_install_dismissed')) return;
    const banner = e(`<div class="toast show" style="background:var(--grad);color:white;border:0;display:flex;justify-content:space-between;gap:10px;align-items:center">
      <span style="font-size:13px">Add Nova to your home screen</span>
      <span><button id="pwa-install" style="background:rgba(255,255,255,0.18);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600">Install</button>
      <button id="pwa-dismiss" style="opacity:.7;margin-left:6px">×</button></span>
    </div>`);
    document.body.appendChild(banner);
    banner.querySelector('#pwa-install').onclick = async () => {
      banner.remove();
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice.outcome === 'accepted') toast('Nova installed — find it on your home screen');
    };
    banner.querySelector('#pwa-dismiss').onclick = () => { sessionStorage.setItem('pwa_install_dismissed','1'); banner.remove(); };
  }, 5000);
});
</script>
